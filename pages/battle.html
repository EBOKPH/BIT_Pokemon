<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIT-POKEMON — Battle Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
    <style>
      :root {
        --green: #4aff6a;
        --green-dim: rgba(74,255,106,0.15);
        --green-dark: #0a1f0f;
        --amber: #ffb830;
        --red: #ff4444;
        --blue: #4ab8ff;
        --purple: #c44aff;
        --bg: #060908;
        --panel: #0c120e;
        --border: rgba(74,255,106,0.18);
        --border-dim: rgba(74,255,106,0.08);
        --text: #c8e8a0;
        --text-dim: #4a6a38;
        --mono: "Share Tech Mono", monospace;
        --ui: "Rajdhani", sans-serif;
        --display: "Bebas Neue", sans-serif;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:100%; height:100vh; overflow:hidden; font-family:var(--ui); color:var(--text); background:var(--bg); }

      /* ── SCANLINES ── */
      body::after {
        content:""; position:fixed; inset:0; z-index:999; pointer-events:none;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      }

      /* ── BATTLE ARENA BACKGROUND ── */
      #arena-bg {
        position:fixed; inset:0; z-index:0;
        background:
          radial-gradient(ellipse 120% 60% at 50% 30%, rgba(20,40,20,0.9) 0%, transparent 70%),
          radial-gradient(ellipse 80% 80% at 20% 80%, rgba(74,255,106,0.04) 0%, transparent 60%),
          radial-gradient(ellipse 80% 80% at 80% 80%, rgba(74,255,106,0.04) 0%, transparent 60%),
          linear-gradient(180deg, #050c07 0%, #060908 40%, #070d09 100%);
        animation: arenaPulse 8s ease-in-out infinite;
      }
      @keyframes arenaPulse {
        0%,100% { filter: brightness(1); }
        50% { filter: brightness(1.08); }
      }

      /* Ground plane */
      #ground {
        position:fixed; bottom:0; left:0; right:0; z-index:1;
        height:45%;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(74,255,106,0.015) 30%,
          rgba(74,255,106,0.03) 60%,
          rgba(74,255,106,0.05) 100%
        );
        border-top: 1px solid rgba(74,255,106,0.08);
      }
      /* Ground grid lines */
      #ground::before {
        content:""; position:absolute; inset:0;
        background:
          repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(74,255,106,0.04) 60px, rgba(74,255,106,0.04) 61px),
          repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(74,255,106,0.025) 40px, rgba(74,255,106,0.025) 41px);
        transform: perspective(300px) rotateX(30deg);
        transform-origin: top center;
      }

      /* ── WEATHER OVERLAY ── */
      #weather { position:fixed; inset:0; z-index:2; pointer-events:none; }

      /* ── ATTACK FLASH ── */
      #attackFlash {
        position:fixed; inset:0; z-index:50; pointer-events:none;
        background:white; opacity:0; transition:opacity 0.05s;
      }
      #attackFlash.flash { opacity:0.35; }

      /* ── CRITICAL HIT OVERLAY ── */
      #critOverlay {
        position:fixed; inset:0; z-index:51; pointer-events:none; display:none;
        align-items:center; justify-content:center;
      }
      #critOverlay.show { display:flex; }
      .crit-text {
        font-family:var(--display); font-size:clamp(40px,8vw,80px);
        letter-spacing:10px; color:#ffb830;
        text-shadow: 0 0 30px #ffb830, 0 0 60px rgba(255,184,48,0.5);
        animation: critAnim 0.8s ease forwards;
      }
      @keyframes critAnim {
        0%   { transform:scale(0.5) rotate(-5deg); opacity:0; }
        30%  { transform:scale(1.2) rotate(2deg);  opacity:1; }
        70%  { transform:scale(1.05) rotate(0deg); opacity:1; }
        100% { transform:scale(1) rotate(0deg);    opacity:0; }
      }

      /* ── NAVBAR PLACEHOLDER ── */
      #navbar-placeholder { position:relative; z-index:100; }

      /* ── MAIN LAYOUT ── */
      .battle-page {
        position:relative; z-index:10;
        height:calc(100vh - 58px);
        display:grid;
        grid-template-rows: 1fr auto;
        grid-template-columns: 1fr;
        overflow:hidden;
      }

      /* ── ARENA ── */
      .arena {
        position:relative;
        display:grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr auto;
        padding:16px 24px 0;
        gap:0;
      }

      /* ── POKEMON HUD CARDS ── */
      .pokemon-hud {
        position:relative;
        background: linear-gradient(135deg, rgba(6,14,4,0.92) 0%, rgba(4,10,2,0.96) 100%);
        border:1px solid var(--border);
        border-radius:3px;
        padding:12px 16px;
        min-width:220px;
        max-width:300px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 4px 24px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
      }
      .pokemon-hud::before {
        content:""; position:absolute; top:-1px; left:-1px;
        width:14px; height:14px;
        border-top:2px solid rgba(74,255,106,0.5);
        border-left:2px solid rgba(74,255,106,0.5);
      }
      .pokemon-hud::after {
        content:""; position:absolute; bottom:-1px; right:-1px;
        width:14px; height:14px;
        border-bottom:2px solid rgba(74,255,106,0.5);
        border-right:2px solid rgba(74,255,106,0.5);
      }
      .hud-enemy { grid-column:1; grid-row:1; align-self:start; }
      .hud-player { grid-column:2; grid-row:3; align-self:end; justify-self:end; }

      .hud-top-row {
        display:flex; align-items:center; justify-content:space-between;
        margin-bottom:6px;
      }
      .hud-name {
        font-family:var(--display); font-size:18px; letter-spacing:3px;
        color:var(--green); text-shadow:0 0 10px rgba(74,255,106,0.3);
      }
      .hud-level {
        font-family:var(--mono); font-size:9px; letter-spacing:2px;
        color:var(--text-dim); background:rgba(74,255,106,0.06);
        border:1px solid var(--border-dim); padding:2px 8px; border-radius:2px;
      }
      .hud-status {
        font-family:var(--mono); font-size:8px; letter-spacing:2px;
        padding:2px 8px; border-radius:2px; display:inline-block;
        margin-bottom:6px; display:none;
      }
      .hud-status.psn { background:rgba(196,74,255,0.15); border:1px solid rgba(196,74,255,0.4); color:#c44aff; display:inline-block; }
      .hud-status.brn { background:rgba(255,100,50,0.15); border:1px solid rgba(255,100,50,0.4); color:#ff6432; display:inline-block; }
      .hud-status.par { background:rgba(255,220,50,0.15); border:1px solid rgba(255,220,50,0.4); color:#ffdc32; display:inline-block; }
      .hud-status.slp { background:rgba(120,120,180,0.15); border:1px solid rgba(120,120,180,0.4); color:#8888cc; display:inline-block; }

      /* HP Bar */
      .hp-label-row {
        display:flex; align-items:center; justify-content:space-between;
        margin-bottom:4px;
      }
      .hp-label { font-family:var(--mono); font-size:8px; letter-spacing:3px; color:var(--text-dim); }
      .hp-numbers { font-family:var(--mono); font-size:9px; letter-spacing:1px; color:var(--text); }
      .hp-track {
        height:6px; background:rgba(0,0,0,0.5); border-radius:3px;
        border:1px solid rgba(74,255,106,0.1); overflow:hidden; position:relative;
      }
      .hp-fill {
        height:100%; border-radius:3px;
        background: linear-gradient(90deg, #4aff6a, #a0ff80);
        transition: width 0.6s cubic-bezier(0.25,0.8,0.25,1), background 0.4s;
        position:relative; overflow:hidden;
      }
      .hp-fill::after {
        content:""; position:absolute; top:0; left:-100%; width:60%; height:100%;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
        animation:hpShine 2s ease-in-out infinite;
      }
      @keyframes hpShine { 0%,100%{left:-100%} 50%{left:150%} }
      .hp-fill.yellow { background:linear-gradient(90deg,#ffb830,#ffd060); }
      .hp-fill.red    { background:linear-gradient(90deg,#ff4444,#ff7070); animation:hpFlicker 0.5s ease-in-out infinite; }
      @keyframes hpFlicker { 0%,100%{opacity:1} 50%{opacity:0.7} }

      /* XP Bar (player only) */
      .xp-row { margin-top:6px; }
      .xp-track {
        height:3px; background:rgba(0,0,0,0.5);
        border-radius:2px; overflow:hidden;
        border:1px solid rgba(74,180,255,0.1);
      }
      .xp-fill {
        height:100%;
        background:linear-gradient(90deg,#4ab8ff,#80d0ff);
        transition:width 1s ease;
      }
      .xp-label { font-family:var(--mono); font-size:7px; letter-spacing:2px; color:rgba(74,180,255,0.5); margin-bottom:2px; }

      /* ── POKEMON SPRITES ── */
      .sprite-zone { position:absolute; pointer-events:none; }
      #enemy-sprite-zone {
        top:80px; right:calc(50% + 20px);
        display:flex; align-items:flex-end; justify-content:center;
        width:200px; height:180px;
      }
      #player-sprite-zone {
        bottom:220px; left:calc(50% + 20px);
        display:flex; align-items:flex-end; justify-content:center;
        width:240px; height:210px;
      }
      .pokemon-sprite {
        image-rendering:pixelated;
        filter:drop-shadow(0 8px 20px rgba(74,255,106,0.25));
        transition:transform 0.3s ease, filter 0.3s;
      }
      #enemy-sprite {
        width:160px; height:160px; object-fit:contain;
        animation:floatEnemy 3s ease-in-out infinite;
      }
      #player-sprite {
        width:200px; height:200px; object-fit:contain;
        animation:floatPlayer 3.5s ease-in-out infinite;
        filter:drop-shadow(0 12px 28px rgba(74,255,106,0.3));
      }
      @keyframes floatEnemy {
        0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}
      }
      @keyframes floatPlayer {
        0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}
      }

      /* Attack animations */
      .sprite-hit { animation:spriteHit 0.4s ease forwards !important; }
      @keyframes spriteHit {
        0%  {transform:translateX(0) translateY(0); filter:brightness(5) saturate(0);}
        25% {transform:translateX(-18px) translateY(0); filter:brightness(3) saturate(0);}
        50% {transform:translateX(12px) translateY(0); filter:brightness(2);}
        75% {transform:translateX(-8px) translateY(0);}
        100%{transform:translateX(0) translateY(0); filter:none;}
      }
      .sprite-attack { animation:spriteAttack 0.35s ease forwards !important; }
      @keyframes spriteAttack {
        0%  {transform:translateX(0);}
        40% {transform:translateX(30px) scale(1.05);}
        100%{transform:translateX(0) scale(1);}
      }
      .enemy-attack { animation:enemyAttack 0.35s ease forwards !important; }
      @keyframes enemyAttack {
        0%  {transform:translateX(0);}
        40% {transform:translateX(-30px) scale(1.05);}
        100%{transform:translateX(0) scale(1);}
      }

      /* Screen shake */
      @keyframes screenShake {
        0%,100%{transform:translate(0,0)}
        10%{transform:translate(-6px,3px)}
        20%{transform:translate(6px,-3px)}
        30%{transform:translate(-4px,5px)}
        40%{transform:translate(4px,-4px)}
        50%{transform:translate(-3px,3px)}
        60%{transform:translate(3px,-2px)}
        70%{transform:translate(-2px,2px)}
        80%{transform:translate(2px,-1px)}
        90%{transform:translate(-1px,1px)}
      }
      .shake { animation:screenShake 0.4s ease; }

      /* Particle burst */
      .particle {
        position:fixed; width:6px; height:6px; border-radius:50%;
        pointer-events:none; z-index:60;
        animation:particleBurst 0.6s ease forwards;
      }
      @keyframes particleBurst {
        0%  {transform:translate(0,0) scale(1); opacity:1;}
        100%{transform:translate(var(--px),var(--py)) scale(0); opacity:0;}
      }

      /* Turn indicator */
      #turnIndicator {
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
        z-index:20; pointer-events:none;
        font-family:var(--mono); font-size:9px; letter-spacing:4px;
        color:rgba(74,255,106,0.6); text-transform:uppercase;
        background:rgba(6,9,8,0.8); border:1px solid var(--border-dim);
        padding:4px 14px; border-radius:2px;
        transition:color 0.3s, border-color 0.3s;
      }
      #turnIndicator.enemy-turn { color:rgba(255,68,68,0.7); border-color:rgba(255,68,68,0.2); }

      /* ── BOTTOM PANEL ── */
      .bottom-panel {
        display:grid;
        grid-template-columns: 1fr 340px;
        gap:0;
        background:linear-gradient(180deg, rgba(4,8,5,0.95) 0%, rgba(6,10,6,0.98) 100%);
        border-top:1px solid var(--border);
        height:200px;
        position:relative;
        z-index:20;
      }
      .bottom-panel::before {
        content:""; position:absolute; top:0; left:0; right:0; height:1px;
        background:linear-gradient(90deg, transparent, var(--green), transparent);
        opacity:0.3;
      }

      /* ── BATTLE LOG ── */
      .battle-log-panel {
        padding:12px 16px;
        border-right:1px solid var(--border-dim);
        display:flex; flex-direction:column;
        overflow:hidden;
      }
      .log-header {
        font-family:var(--mono); font-size:8px; letter-spacing:4px;
        color:var(--text-dim); margin-bottom:8px;
        display:flex; align-items:center; gap:8px;
      }
      .log-header::after { content:""; flex:1; height:1px; background:var(--border-dim); }
      .log-dot { width:5px; height:5px; border-radius:50%; background:var(--green); box-shadow:0 0 4px var(--green); animation:ledBlink 1.5s ease-in-out infinite; }
      @keyframes ledBlink { 0%,100%{opacity:0.4} 50%{opacity:1} }
      .log-scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:rgba(74,255,106,0.2) transparent; }
      .log-scroll::-webkit-scrollbar { width:3px; }
      .log-scroll::-webkit-scrollbar-thumb { background:rgba(74,255,106,0.2); border-radius:2px; }
      .log-entry {
        font-family:var(--mono); font-size:10px; letter-spacing:1px;
        line-height:1.6; padding:2px 0;
        border-bottom:1px solid rgba(74,255,106,0.04);
        animation:logIn 0.2s ease;
      }
      @keyframes logIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }
      .log-entry.sys  { color:var(--text-dim); }
      .log-entry.info { color:var(--text); }
      .log-entry.warn { color:var(--amber); }
      .log-entry.dmg  { color:var(--red); }
      .log-entry.good { color:var(--green); }
      .log-entry.crit { color:#ffb830; text-shadow:0 0 8px rgba(255,184,48,0.4); font-weight:bold; }

      /* ── ACTION PANEL ── */
      .action-panel {
        padding:12px 16px;
        display:flex; flex-direction:column; gap:8px;
      }
      .action-header {
        display:flex; align-items:center; justify-content:space-between;
      }
      .action-label {
        font-family:var(--mono); font-size:8px; letter-spacing:4px; color:var(--text-dim);
      }
      .menu-tabs {
        display:flex; gap:4px;
      }
      .menu-tab {
        font-family:var(--mono); font-size:8px; letter-spacing:2px;
        padding:3px 10px; background:none;
        border:1px solid var(--border-dim); color:var(--text-dim);
        cursor:pointer; transition:all 0.15s; border-radius:2px;
      }
      .menu-tab.active, .menu-tab:hover {
        border-color:rgba(74,255,106,0.35); color:var(--green);
        background:rgba(74,255,106,0.06);
      }
      .menu-tab.danger { border-color:rgba(255,68,68,0.2); color:rgba(255,68,68,0.6); }
      .menu-tab.danger:hover { border-color:rgba(255,68,68,0.5); color:var(--red); background:rgba(255,68,68,0.06); }

      /* Move grid */
      .moves-grid {
        display:grid; grid-template-columns:1fr 1fr; gap:6px;
        flex:1;
      }
      .move-btn {
        position:relative; padding:0; background:none; border:none;
        cursor:pointer; outline:none; transition:transform 0.1s;
        border-radius:3px; overflow:hidden;
      }
      .move-btn:disabled { opacity:0.4; cursor:not-allowed; }
      .move-btn:not(:disabled):active { transform:scale(0.97); }
      .move-inner {
        background:linear-gradient(135deg, rgba(6,14,4,0.9) 0%, rgba(4,10,2,0.95) 100%);
        border:1px solid var(--border);
        border-radius:3px; padding:8px 12px;
        text-align:left; height:100%;
        transition:border-color 0.15s, background 0.15s, box-shadow 0.15s;
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 2px 8px rgba(0,0,0,0.5);
        position:relative; overflow:hidden;
      }
      .move-inner::before {
        content:""; position:absolute; top:0; left:-100%;
        width:60%; height:100%;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);
        transition:left 0.3s;
      }
      .move-btn:not(:disabled):hover .move-inner::before { left:150%; }
      .move-btn:not(:disabled):hover .move-inner {
        border-color:rgba(74,255,106,0.4);
        background:linear-gradient(135deg, rgba(10,20,8,0.95) 0%, rgba(6,14,4,0.98) 100%);
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 0 16px rgba(74,255,106,0.1), 0 4px 12px rgba(0,0,0,0.6);
      }
      /* Type color accent strip */
      .move-inner::after {
        content:""; position:absolute; left:0; top:0; bottom:0;
        width:3px; border-radius:2px 0 0 2px;
        background:var(--move-color, var(--green));
        box-shadow:0 0 8px var(--move-color, var(--green));
      }
      .move-name {
        font-family:var(--display); font-size:14px; letter-spacing:2px;
        color:var(--text); display:block; margin-bottom:3px; padding-left:8px;
      }
      .move-meta { display:flex; align-items:center; gap:6px; padding-left:8px; }
      .move-type {
        font-family:var(--mono); font-size:7px; letter-spacing:2px;
        padding:1px 6px; border-radius:2px;
        background:rgba(var(--move-rgb,74,255,106),0.12);
        border:1px solid rgba(var(--move-rgb,74,255,106),0.3);
        color:var(--move-color,var(--green));
        text-transform:uppercase;
      }
      .move-power { font-family:var(--mono); font-size:8px; color:var(--text-dim); letter-spacing:1px; }
      .move-pp { font-family:var(--mono); font-size:7px; color:var(--text-dim); margin-left:auto; }

      /* Other menu panels (bag, pokemon, run) */
      .other-panel { display:none; flex-direction:column; gap:6px; }
      .other-panel.active { display:flex; }
      .other-btn {
        font-family:var(--mono); font-size:9px; letter-spacing:2px;
        padding:8px 14px; background:rgba(6,14,4,0.8);
        border:1px solid var(--border); color:var(--text);
        cursor:pointer; transition:all 0.15s; text-align:left;
        border-radius:2px;
      }
      .other-btn:hover { border-color:rgba(74,255,106,0.35); color:var(--green); }

      /* ── VICTORY / DEFEAT OVERLAY ── */
      #endOverlay {
        position:fixed; inset:0; z-index:200;
        background:rgba(0,0,0,0.88); display:none;
        align-items:center; justify-content:center;
        backdrop-filter:blur(4px);
      }
      #endOverlay.show { display:flex; }
      .end-box {
        background:linear-gradient(160deg,#0e160f,#080d09);
        border:1px solid var(--border); border-radius:4px;
        padding:40px 48px; text-align:center;
        box-shadow:0 0 60px rgba(74,255,106,0.1);
        animation:endBoxIn 0.5s cubic-bezier(0.25,0.8,0.25,1);
        position:relative; overflow:hidden;
      }
      @keyframes endBoxIn {
        from{opacity:0;transform:scale(0.8) translateY(20px)}
        to{opacity:1;transform:none}
      }
      .end-box::before {
        content:""; position:absolute; top:-1px; left:-1px;
        width:18px; height:18px;
        border-top:2px solid rgba(74,255,106,0.5);
        border-left:2px solid rgba(74,255,106,0.5);
      }
      .end-title {
        font-family:var(--display); font-size:clamp(36px,6vw,56px);
        letter-spacing:8px; margin-bottom:12px;
      }
      .end-title.victory { color:var(--green); text-shadow:0 0 30px rgba(74,255,106,0.5); }
      .end-title.defeat  { color:var(--red);   text-shadow:0 0 30px rgba(255,68,68,0.5); }
      .end-sub {
        font-family:var(--mono); font-size:10px; letter-spacing:3px;
        color:var(--text-dim); margin-bottom:28px;
      }
      .end-xp {
        font-family:var(--mono); font-size:12px; letter-spacing:2px;
        color:var(--amber); margin-bottom:20px;
      }
      .end-actions { display:flex; gap:10px; justify-content:center; }
      .end-btn {
        font-family:var(--mono); font-size:9px; letter-spacing:3px;
        padding:10px 24px; border-radius:2px; cursor:pointer;
        transition:all 0.2s; text-transform:uppercase;
      }
      .end-btn.primary {
        background:rgba(74,255,106,0.08); border:1px solid rgba(74,255,106,0.35); color:var(--green);
      }
      .end-btn.primary:hover { background:rgba(74,255,106,0.16); border-color:var(--green); }
      .end-btn.secondary {

      /* ── TYPE COLORS ── */

        #enemy-sprite { width:100px; height:100px; }

      }
    </style>
  </head>
  <body>

    <!-- END OVERLAY -->
    <div id="endOverlay">
      <div class="end-box">

        <div class="end-actions">
          <button class="end-btn primary" onclick="goBack()">↩ RETURN TO FIELD</button>
          <button class="end-btn secondary" onclick="catchAfterWin()">⬡ CATCH FRAGMENT</button>
        </div>
      </div>
    </div>

    <script>
    // ══════════════════════════════════════════════════════
    //  BIT-POKEMON — BATTLE ENGINE
    // ══════════════════════════════════════════════════════

    // ── SOUND ENGINE (same pattern as game.html) ──────────
    const SFX = (() => {
      let _ctx = null;
      function ctx() {
        if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (_ctx.state === 'suspended') _ctx.resume();
        return _ctx;
      }
      function osc(freq, type, dur, vol, freqEnd) {
        const c=ctx(), o=c.createOscillator(), g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type=type; o.frequency.setValueAtTime(freq, c.currentTime);
        if (freqEnd) o.frequency.linearRampToValueAtTime(freqEnd, c.currentTime+dur);
        g.gain.setValueAtTime(vol, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
        o.start(); o.stop(c.currentTime+dur);
      }
      function noise(dur=0.06, vol=0.04) {
        const c=ctx(), buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
        const src=c.createBufferSource(), g=c.createGain();
        src.buffer=buf; src.connect(g); g.connect(c.destination);
        g.gain.setValueAtTime(vol, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
        src.start(); src.stop(c.currentTime+dur);
      }
      return {
        hit()     { osc(220,'sawtooth',0.08,0.12); setTimeout(()=>osc(180,'square',0.06,0.08),60); },
        crit()    { osc(660,'sine',0.05,0.1); setTimeout(()=>osc(880,'sine',0.1,0.12),60); setTimeout(()=>osc(1100,'sine',0.15,0.1),130); },
        victory() { [440,550,660,880].forEach((f,i)=>setTimeout(()=>osc(f,'sine',0.18,0.09),i*120)); },
        defeat()  { [440,330,220,180].forEach((f,i)=>setTimeout(()=>osc(f,'square',0.2,0.07),i*130)); },
        select()  { osc(600,'square',0.04,0.06); setTimeout(()=>osc(800,'square',0.06,0.06),40); },
        run()     { osc(400,'sine',0.06,0.07,200); setTimeout(()=>osc(300,'sine',0.1,0.05,150),80); },
        catch_()  { noise(0.08,0.05); setTimeout(()=>osc(440,'sine',0.2,0.07,660),100); },
        levelup() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>osc(f,'sine',0.15,0.1),i*100)); },
      };
    })();

    // ── TYPE COLOR MAP ──────────────────────────────────────
    const TYPE_COLORS = {
      normal:'#a8a878', fire:'#f08030', water:'#6890f0', grass:'#78c850',
      electric:'#f8d030', ice:'#98d8d8', fighting:'#c03028', poison:'#a040a0',
      ground:'#e0c068', flying:'#a890f0', psychic:'#f85888', bug:'#a8b820',
      rock:'#b8a038', ghost:'#705898', dragon:'#7038f8', dark:'#705848',
      steel:'#b8b8d0', fairy:'#ee99ac',
    };
    const TYPE_RGB = {
      normal:'168,168,120', fire:'240,128,48', water:'104,144,240', grass:'120,200,80',
      electric:'248,208,48', ice:'152,216,216', fighting:'192,48,40', poison:'160,64,160',
      ground:'224,192,104', flying:'168,144,240', psychic:'248,88,136', bug:'168,184,32',
      rock:'184,160,56', ghost:'112,88,152', dragon:'112,56,248', dark:'112,88,72',
      steel:'184,184,208', fairy:'238,153,172',
    };

    // ── BATTLE STATE ────────────────────────────────────────
    let playerPokemon = null;   // { name, sprite, types, level, hp, maxHp, moves, exp }
    let enemyPokemon  = null;   // { name, sprite, types, level, hp, maxHp, moves }
    let playerTurn = true;
    let battleOver = false;
    let inventory = { pokeball:0, greatball:0, ultraball:0 };

    // ── LOG ─────────────────────────────────────────────────
    function log(msg, cls='info') {
      const el = document.getElementById('battleLog');
      const div = document.createElement('div');
      div.className = `log-entry ${cls}`;
      div.textContent = msg;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    // ── HP BAR UPDATE ────────────────────────────────────────
    function updateHpBar(who, hp, maxHp) {
      const pct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
      const fill = document.getElementById(`${who}HpFill`);
      const num  = document.getElementById(`${who}HpNum`);
      fill.style.width = pct + '%';
      fill.className = 'hp-fill' + (pct <= 20 ? ' red' : pct <= 50 ? ' yellow' : '');
      num.textContent = `${Math.max(0,hp)} / ${maxHp}`;
    }

    // ── PARTICLES ────────────────────────────────────────────
    function burst(x, y, color='#4aff6a', count=12) {
      for (let i=0; i<count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (i/count)*Math.PI*2;
        const dist  = 30+Math.random()*60;
        p.style.cssText = `left:${x}px;top:${y}px;background:${color};--px:${Math.cos(angle)*dist}px;--py:${Math.sin(angle)*dist}px;animation-duration:${0.4+Math.random()*0.3}s`;
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 700);
      }
    }

    // ── SCREEN SHAKE ────────────────────────────────────────
    function shake() {
      const el = document.getElementById('arenaEl');
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      setTimeout(()=>el.classList.remove('shake'), 400);
    }

    // ── FLASH ────────────────────────────────────────────────
    function flash(color='white') {
      const f = document.getElementById('attackFlash');
      f.style.background = color;
      f.classList.add('flash');
      setTimeout(()=>f.classList.remove('flash'), 120);
    }

    // ── GENERATE MOVES (from PokeAPI moves or fallback) ──────
    function generateMoves(types, level) {
      const typeMoves = {
        fire:     [{name:'EMBER',type:'fire',power:40,pp:25},{name:'FLAMETHROWER',type:'fire',power:90,pp:15},{name:'FIRE BLAST',type:'fire',power:110,pp:5}],
        water:    [{name:'WATER GUN',type:'water',power:40,pp:25},{name:'SURF',type:'water',power:90,pp:15},{name:'HYDRO PUMP',type:'water',power:110,pp:5}],
        grass:    [{name:'VINE WHIP',type:'grass',power:45,pp:25},{name:'RAZOR LEAF',type:'grass',power:55,pp:25},{name:'SOLAR BEAM',type:'grass',power:120,pp:10}],
        electric: [{name:'THUNDER SHOCK',type:'electric',power:40,pp:30},{name:'THUNDERBOLT',type:'electric',power:90,pp:15},{name:'THUNDER',type:'electric',power:110,pp:10}],
        psychic:  [{name:'CONFUSION',type:'psychic',power:50,pp:25},{name:'PSYBEAM',type:'psychic',power:65,pp:20},{name:'PSYCHIC',type:'psychic',power:90,pp:10}],
        normal:   [{name:'TACKLE',type:'normal',power:40,pp:35},{name:'BODY SLAM',type:'normal',power:85,pp:15},{name:'HYPER BEAM',type:'normal',power:150,pp:5}],
        fighting: [{name:'LOW KICK',type:'fighting',power:50,pp:20},{name:'BRICK BREAK',type:'fighting',power:75,pp:15},{name:'CLOSE COMBAT',type:'fighting',power:120,pp:5}],
        poison:   [{name:'POISON STING',type:'poison',power:15,pp:35},{name:'SLUDGE BOMB',type:'poison',power:90,pp:10},{name:'GUNK SHOT',type:'poison',power:120,pp:5}],
        ghost:    [{name:'LICK',type:'ghost',power:30,pp:30},{name:'SHADOW BALL',type:'ghost',power:80,pp:15},{name:'SHADOW FORCE',type:'ghost',power:120,pp:5}],
        dragon:   [{name:'DRAGON RAGE',type:'dragon',power:60,pp:10},{name:'DRAGON PULSE',type:'dragon',power:85,pp:10},{name:'DRACO METEOR',type:'dragon',power:130,pp:5}],
        ice:      [{name:'ICE SHARD',type:'ice',power:40,pp:30},{name:'ICE BEAM',type:'ice',power:90,pp:10},{name:'BLIZZARD',type:'ice',power:110,pp:5}],
        bug:      [{name:'BUG BITE',type:'bug',power:60,pp:20},{name:'SIGNAL BEAM',type:'bug',power:75,pp:15},{name:'BUG BUZZ',type:'bug',power:90,pp:10}],
        rock:     [{name:'ROCK THROW',type:'rock',power:50,pp:15},{name:'ROCK SLIDE',type:'rock',power:75,pp:10},{name:'STONE EDGE',type:'rock',power:100,pp:5}],
        ground:   [{name:'MUD SHOT',type:'ground',power:55,pp:15},{name:'EARTHQUAKE',type:'ground',power:100,pp:10},{name:'FISSURE',type:'ground',power:150,pp:5}],
        flying:   [{name:'GUST',type:'flying',power:40,pp:35},{name:'AIR SLASH',type:'flying',power:75,pp:15},{name:'HURRICANE',type:'flying',power:110,pp:10}],
        dark:     [{name:'BITE',type:'dark',power:60,pp:25},{name:'CRUNCH',type:'dark',power:80,pp:15},{name:'DARK PULSE',type:'dark',power:80,pp:15}],
        steel:    [{name:'METAL CLAW',type:'steel',power:50,pp:35},{name:'IRON HEAD',type:'steel',power:80,pp:15},{name:'FLASH CANNON',type:'steel',power:80,pp:10}],
        fairy:    [{name:'FAIRY WIND',type:'fairy',power:40,pp:30},{name:'MOONBLAST',type:'fairy',power:95,pp:15},{name:'DAZZLING GLEAM',type:'fairy',power:80,pp:10}],
      };
      const primary = types[0] || 'normal';
      const pool = typeMoves[primary] || typeMoves.normal;
      // Pick 2-3 from primary type, 1 normal filler
      const moves = pool.slice(0, 3);
      moves.push({name:'QUICK ATTACK', type:'normal', power:40, pp:30});
      return moves.slice(0,4).map(m=>({...m, currentPp:m.pp}));
    }

    // ── DAMAGE CALCULATION ───────────────────────────────────
    function calcDamage(attackerLv, movePower, isCrit=false) {
      // Simplified formula
      const base = ((2 * attackerLv / 5 + 2) * movePower * 1) / 50 + 2;
      const randomFactor = 0.85 + Math.random() * 0.15;
      const critMulti = isCrit ? 1.5 : 1;
      return Math.max(1, Math.round(base * randomFactor * critMulti));
    }

    // ── ENEMY AI ─────────────────────────────────────────────
    function enemyMove() {
      if (battleOver) return;
      const moves = enemyPokemon.moves.filter(m => m.currentPp > 0);
      if (!moves.length) { log('Enemy has no PP left!','warn'); endTurn(); return; }
      // AI: prefer high power moves, occasionally random
      const move = Math.random() < 0.7
        ? moves.reduce((a,b)=>b.power>a.power?b:a)
        : moves[Math.floor(Math.random()*moves.length)];

      setTimeout(() => {
        move.currentPp--;
        const isCrit = Math.random() < 0.08;
        const dmg = calcDamage(enemyPokemon.level, move.power, isCrit);
        playerPokemon.hp = Math.max(0, playerPokemon.hp - dmg);

        // Animate
        document.getElementById('enemy-sprite').classList.remove('enemy-attack');
        void document.getElementById('enemy-sprite').offsetWidth;
        document.getElementById('enemy-sprite').classList.add('enemy-attack');

        setTimeout(() => {
          flash('rgba(255,68,68,0.4)');
          shake();
          document.getElementById('player-sprite').classList.add('sprite-hit');
          setTimeout(()=>document.getElementById('player-sprite').classList.remove('sprite-hit'),400);

          if (isCrit) {
            SFX.crit();
            const co = document.getElementById('critOverlay');
            co.classList.add('show');
            setTimeout(()=>co.classList.remove('show'),900);
            log(`CRITICAL HIT! Enemy ${move.name} — ${dmg} damage!`,'crit');
          } else {
            SFX.hit();
            log(`Enemy used ${move.name} — ${dmg} damage`,'dmg');
          }

          // Particle burst on player sprite
          const ps = document.getElementById('player-sprite');
          const r  = ps.getBoundingClientRect();
          burst(r.left+r.width/2, r.top+r.height/2, '#ff4444', 10);

          updateHpBar('player', playerPokemon.hp, playerPokemon.maxHp);

          if (playerPokemon.hp <= 0) {
            setTimeout(()=>endBattle(false), 600);
          } else {
            setTimeout(()=>endTurn(), 400);
          }
        }, 300);
      }, 600 + Math.random()*400);
    }

    // ── PLAYER USES MOVE ─────────────────────────────────────
    window.useMove = function(idx) {
      if (!playerTurn || battleOver) return;
      const move = playerPokemon.moves[idx];
      if (!move || move.currentPp <= 0) { log('No PP remaining for this move.','warn'); return; }

      SFX.select();
      setTurn(false);
      move.currentPp--;

      const isCrit = Math.random() < 0.0625;
      const dmg    = calcDamage(playerPokemon.level, move.power, isCrit);
      enemyPokemon.hp = Math.max(0, enemyPokemon.hp - dmg);

      // Player attack animation
      const pSpr = document.getElementById('player-sprite');
      pSpr.classList.remove('sprite-attack');
      void pSpr.offsetWidth;
      pSpr.classList.add('sprite-attack');

      setTimeout(()=>{
        flash('rgba(74,255,106,0.25)');
        shake();
        const eSpr = document.getElementById('enemy-sprite');
        eSpr.classList.add('sprite-hit');
        setTimeout(()=>eSpr.classList.remove('sprite-hit'),400);

        // Particles on enemy
        const r = eSpr.getBoundingClientRect();
        burst(r.left+r.width/2, r.top+r.height/2, TYPE_COLORS[move.type]||'#4aff6a', 14);

        if (isCrit) {
          SFX.crit();
          const co = document.getElementById('critOverlay');
          co.classList.add('show');
          setTimeout(()=>co.classList.remove('show'),900);
          log(`CRITICAL HIT! ${move.name} — ${dmg} damage!`,'crit');
        } else {
          SFX.hit();
          log(`Used ${move.name} — ${dmg} damage`,'info');
        }

        updateHpBar('enemy', enemyPokemon.hp, enemyPokemon.maxHp);
        renderMoves(); // update PP

        if (enemyPokemon.hp <= 0) {
          setTimeout(()=>endBattle(true), 600);
        } else {
          // Enemy turn
          document.getElementById('turnIndicator').textContent = 'ENEMY TURN';
          document.getElementById('turnIndicator').classList.add('enemy-turn');
          log(`${enemyPokemon.name.toUpperCase()} is thinking...`,'sys');
          enemyMove();
        }
      }, 280);
    };

    function endTurn() {
      if (battleOver) return;
      setTurn(true);
    }

    function setTurn(isPlayer) {
      playerTurn = isPlayer;
      const ind = document.getElementById('turnIndicator');
      const btns = document.querySelectorAll('.move-btn');
      if (isPlayer) {
        ind.textContent = 'YOUR TURN';
        ind.classList.remove('enemy-turn');
        btns.forEach(b=>b.disabled=false);
      } else {
        ind.textContent = 'ENEMY TURN';
        ind.classList.add('enemy-turn');
        btns.forEach(b=>b.disabled=true);
      }
    }

    // ── END BATTLE ───────────────────────────────────────────
    function endBattle(won) {
      battleOver = true;
      const overlay = document.getElementById('endOverlay');
      const title   = document.getElementById('endTitle');
      const sub     = document.getElementById('endSub');
      const xpEl    = document.getElementById('endXp');
      const catchBtn = overlay.querySelector('.end-btn.secondary');

      if (won) {
        SFX.victory();
        title.textContent = 'VICTORY';
        title.className   = 'end-title victory';
        sub.textContent   = `${enemyPokemon.name.toUpperCase()} WAS DEFEATED`;
        const xpGained = Math.round(enemyPokemon.exp * enemyPokemon.level / 7);
        xpEl.textContent  = `+ ${xpGained} EXP GAINED`;
        log(`${enemyPokemon.name.toUpperCase()} fainted!`,'good');
        log(`You gained ${xpGained} EXP!`,'good');
        // show catch button only on win
        catchBtn.style.display = 'inline-block';
        SFX.levelup();
      } else {
        SFX.defeat();
        title.textContent = 'DEFEATED';
        title.className   = 'end-title defeat';
        sub.textContent   = `${playerPokemon.name.toUpperCase()} FAINTED`;
        xpEl.textContent  = '';
        log(`${playerPokemon.name.toUpperCase()} fainted...`,'dmg');
        catchBtn.style.display = 'none';
      }

      setTimeout(()=>overlay.classList.add('show'), 800);
    }

    // ── RUN ──────────────────────────────────────────────────
    window.tryRun = function() {
      if (battleOver) return;
      const chance = Math.random();
      if (chance < 0.5) {
        SFX.run();
        log('Got away safely!','good');
        setTimeout(()=>goBack(), 800);
      } else {
        log('Couldn\'t escape!','warn');
        if (playerTurn) {
          setTurn(false);
          document.getElementById('turnIndicator').textContent = 'ENEMY TURN';
          document.getElementById('turnIndicator').classList.add('enemy-turn');
          enemyMove();
        }
      }
    };

    // ── BAG / CATCH ──────────────────────────────────────────
    window.useBall = function(ballType) {
      if (!playerTurn || battleOver) return;
      if (inventory[ballType] <= 0) { log(`No ${ballType}s left!`,'warn'); return; }
      inventory[ballType]--;
      updateInventoryUI();

      // Catch rate: lower enemy HP = higher chance; ultraball > greatball > pokeball
      const hpRatio = enemyPokemon.hp / enemyPokemon.maxHp;
      const ballBonus = ballType==='ultraball' ? 2 : ballType==='greatball' ? 1.5 : 1;
      const catchRate = Math.max(0.05, Math.min(0.95, (1 - hpRatio) * ballBonus * 0.6 + 0.2));

      SFX.catch_();
      setTurn(false);
      log(`Threw a ${ballType.toUpperCase()}...`,'info');

      setTimeout(()=>{
        if (Math.random() < catchRate) {
          log(`${enemyPokemon.name.toUpperCase()} was caught!`,'good');
          saveToBackend();
          setTimeout(()=>endBattle(true), 400);
        } else {
          log(`${enemyPokemon.name.toUpperCase()} broke free!`,'warn');
          enemyMove();
        }
      }, 1200);
    };

    function updateInventoryUI() {
      document.getElementById('cnt-pokeball').textContent  = `×${inventory.pokeball}`;
      document.getElementById('cnt-greatball').textContent = `×${inventory.greatball}`;
      document.getElementById('cnt-ultraball').textContent = `×${inventory.ultraball}`;
    }

    // ── TAB SWITCHING ────────────────────────────────────────
    window.switchTab = function(tab) {
      document.getElementById('fightPanel').style.display   = tab==='fight' ? 'grid' : 'none';
      document.getElementById('bagPanel').className         = 'other-panel' + (tab==='bag' ? ' active' : '');
      document.getElementById('pokemonPanel').className     = 'other-panel' + (tab==='pokemon' ? ' active' : '');
      document.getElementById('tabFight').className         = 'menu-tab' + (tab==='fight' ? ' active' : '');
      document.getElementById('tabBag').className           = 'menu-tab' + (tab==='bag' ? ' active' : '');
      document.getElementById('tabPoke').className          = 'menu-tab' + (tab==='pokemon' ? ' active' : '');
    };

    // ── RENDER MOVES ─────────────────────────────────────────
    function renderMoves() {
      const grid = document.getElementById('fightPanel');
      grid.innerHTML = '';
      (playerPokemon?.moves || []).forEach((move, i) => {
        const color = TYPE_COLORS[move.type] || '#4aff6a';
        const rgb   = TYPE_RGB[move.type]   || '74,255,106';
        const outPp = move.currentPp <= 0;
        grid.innerHTML += `
          <button class="move-btn" onclick="useMove(${i})" ${outPp?'disabled':''}>
            <div class="move-inner" style="--move-color:${color};--move-rgb:${rgb}">
              <span class="move-name">${move.name}</span>
              <div class="move-meta">
                <span class="move-type">${move.type}</span>
                <span class="move-power">PWR ${move.power}</span>
                <span class="move-pp">${move.currentPp}/${move.pp} PP</span>
              </div>
            </div>
          </button>`;
      });
    }

    // ── SAVE CAUGHT POKEMON ──────────────────────────────────
    async function saveToBackend() {
      const user_id = localStorage.getItem('user_id');
      const token   = localStorage.getItem('token');
      if (!user_id || !token || !enemyPokemon) return;
      try {
        const { API_BASE_URL } = await import('../api.js');
        await fetch(`${API_BASE_URL}/users/${user_id}/pokemon`, {
          method:'POST',
          headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
          body: JSON.stringify({
            pokemon_id: enemyPokemon.id,
            name: enemyPokemon.name,
            sprite: enemyPokemon.sprite,
            types: enemyPokemon.types,
            level: enemyPokemon.level,
            pokedex_no: enemyPokemon.id,
          })
        });
        log('Fragment chip encoded — saved to storage!','good');
      } catch(e) {
        log('Could not save to backend — local only','warn');
      }
    }

    // ── NAV ──────────────────────────────────────────────────
    window.goBack = function() { window.location.href='game.html'; };
    window.catchAfterWin = function() {
      const wild = localStorage.getItem('caughtPokemon');
      if (!wild) { goBack(); return; }
      saveToBackend().then(()=>goBack());
    };

    // ── BUILD POKEMON FROM DATA ──────────────────────────────
    function buildPokemon(apiData, level, isPlayer=false) {
      const types = apiData.types.map(t=>t.type.name);
      const maxHp = Math.round((apiData.stats.find(s=>s.stat.name==='hp')?.base_stat || 45) * level / 50 + level + 10);
      const moves = generateMoves(types, level);
      return {
        id:     apiData.id,
        name:   apiData.name,
        sprite: isPlayer
          ? (apiData.sprites.back_default || apiData.sprites.front_default)
          : apiData.sprites.front_default,
        types,
        level,
        hp:    maxHp,
        maxHp,
        moves,
        exp:   apiData.base_experience || 50,
      };
    }

    // ── INIT BATTLE ──────────────────────────────────────────
    async function initBattle() {
      log('BATTLE PROTOCOL INITIALIZING...','sys');

      // ── Get wild pokemon from localStorage (set by game.html) ──
      const wildRaw = localStorage.getItem('caughtPokemon');
      let wildData  = wildRaw ? JSON.parse(wildRaw) : null;

      // ── Get player's first pokemon ──
      const userPokemonRaw = localStorage.getItem('userPokemon');
      let userParty = userPokemonRaw ? JSON.parse(userPokemonRaw) : null;

      // Fetch enemy from PokeAPI
      let enemyApiId = wildData?.id || Math.ceil(Math.random()*151);
      try {
        const [enemyRes] = await Promise.all([
          fetch(`https://pokeapi.co/api/v2/pokemon/${enemyApiId}`)
        ]);
        const enemyApi = await enemyRes.json();
        const enemyLv  = wildData?.level || (10 + Math.floor(Math.random()*30));
        enemyPokemon = buildPokemon(enemyApi, enemyLv, false);

        document.getElementById('enemyName').textContent  = enemyPokemon.name.toUpperCase();
        document.getElementById('enemyLevel').textContent = `Lv.${enemyPokemon.level}`;
        document.getElementById('enemy-sprite').src       = enemyPokemon.sprite;
        updateHpBar('enemy', enemyPokemon.hp, enemyPokemon.maxHp);
        log(`Wild ${enemyPokemon.name.toUpperCase()} appeared! (Lv.${enemyPokemon.level})`,'warn');
      } catch(e) {
        log('Failed to load enemy data','dmg');
      }

      // Fetch player pokemon from PokeAPI (use first in party or stored data)
      let playerApiId = 1; // fallback: bulbasaur
      if (userParty && userParty.length > 0) {
        const first = userParty[0];
        playerApiId = first.pokemon_id || first.pokedex_no || first.id || 1;
      }
      try {
        const playerRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${playerApiId}`);
        const playerApi = await playerRes.json();
        const userFirst = userParty?.[0];
        const playerLv  = userFirst?.level ||
15;
        playerPokemon = buildPokemon(playerApi, playerLv, true);
        if (userFirst?.current_hp && userFirst.current_hp > 0) {
          playerPokemon.hp = Math.min(userFirst.current_hp, playerPokemon.maxHp);
        }

        document.getElementById('playerName').textContent  = playerPokemon.name.toUpperCase();
        document.getElementById('playerLevel').textContent = `Lv.${playerPokemon.level}`;
        document.getElementById('player-sprite').src       = playerPokemon.sprite;
        updateHpBar('player', playerPokemon.hp, playerPokemon.maxHp);
        renderMoves();
        log(`Go, ${playerPokemon.name.toUpperCase()}!`,'good');
      } catch(e) {
        log('Failed to load player pokemon — using fallback','warn');
      }

      // Load inventory counts
      const user_id = localStorage.getItem('user_id');
      const token   = localStorage.getItem('token');
      if (user_id && token) {
        try {
          const { API_BASE_URL } = await import('../api.js');
          const res = await fetch(`${API_BASE_URL}/users/${user_id}`, {
            headers:{'Authorization':`Bearer ${token}`}
          });
          const data = await res.json();
          if (data.success && data.data) {
            inventory.pokeball  = data.data.pokeball  || 0;
            inventory.greatball = data.data.greatball || 0;
            inventory.ultraball = data.data.ultraball || 0;
            updateInventoryUI();
          }
        } catch(e) {}
      }

      log('BATTLE START — choose your move.','sys');
      setTurn(true);
    }

    initBattle();
    </script>

    <!-- NAVBAR -->
    <script>
      fetch("navbar.html")
        .then(r=>r.text())
        .then(data=>{
          document.getElementById("navbar-placeholder").innerHTML = data;
          if (typeof window.attachLogoutHandler==="function") window.attachLogoutHandler();
          if (typeof window.loadProfileName==="function") window.loadProfileName();
          if (typeof window.updateWPCBalance==="function") window.updateWPCBalance();
        });
    </script>

  </body>
