<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIT-POKEMON — Battle Protocol</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green: #4aff6a;
        --green-dim: rgba(74, 255, 106, 0.15);
        --green-dark: #0a1f0f;
        --amber: #ffb830;
        --red: #ff4444;
        --blue: #4ab8ff;
        --purple: #c44aff;
        --bg: #060908;
        --panel: #0c120e;
        --border: rgba(74, 255, 106, 0.18);
        --border-dim: rgba(74, 255, 106, 0.08);
        --text: #c8e8a0;
        --text-dim: #4a6a38;
        --mono: "Share Tech Mono", monospace;
        --ui: "Rajdhani", sans-serif;
        --display: "Bebas Neue", sans-serif;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: var(--ui);
        color: var(--text);
        background: var(--bg);
      }

      /* ── SCANLINES ── */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.06) 2px,
          rgba(0, 0, 0, 0.06) 4px
        );
      }

      /* ── MAP BACKGROUND (from game.html) ── */
      #map-bg {
        position: fixed;
        inset: 0;
        z-index: 1;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.8;
        transition: background-image 0.5s ease;
        filter: saturate(1.1) contrast(1.05);
      }

      /* Dark vignette over map */
      #map-vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 80% 80% at 50% 50%,
            transparent 0%,
            rgba(0, 0, 0, 0.3) 60%,
            rgba(0, 0, 0, 0.6) 100%
          ),
          radial-gradient(
            ellipse 120% 60% at 50% 30%,
            rgba(74, 255, 106, 0.02) 0%,
            transparent 70%
          );
      }

      /* ── BATTLE ARENA BACKGROUND ── */
      #arena-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 120% 60% at 50% 30%,
            rgba(20, 40, 20, 0.3) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 80% 80% at 20% 80%,
            rgba(74, 255, 106, 0.04) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 80% 80% at 80% 80%,
            rgba(74, 255, 106, 0.04) 0%,
            transparent 60%
          ),
          linear-gradient(
            180deg,
            rgba(5, 12, 7, 0.4) 0%,
            rgba(6, 9, 8, 0.4) 40%,
            rgba(7, 13, 9, 0.4) 100%
          );
        animation: arenaPulse 8s ease-in-out infinite;
      }
      @keyframes arenaPulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.08);
        }
      }

      /* Ground plane */
      #ground {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 4;
        height: 45%;
        display: none;
        background: linear-gradient(
          180deg,
          transparent 0%,
          rgba(74, 255, 106, 0.015) 30%,
          rgba(74, 255, 106, 0.03) 60%,
          rgba(74, 255, 106, 0.05) 100%
        );
        border-top: 1px solid rgba(74, 255, 106, 0.08);
      }
      /* Ground grid lines */
      #ground::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 60px,
            rgba(74, 255, 106, 0.04) 60px,
            rgba(74, 255, 106, 0.04) 61px
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 40px,
            rgba(74, 255, 106, 0.025) 40px,
            rgba(74, 255, 106, 0.025) 41px
          );
        transform: perspective(300px) rotateX(30deg);
        transform-origin: top center;
      }

      /* ── WEATHER OVERLAY ── */
      #weather {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      /* ── ATTACK FLASH ── */
      #attackFlash {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        background: white;
        opacity: 0;
        transition:
          opacity 0.05s,
          box-shadow 0.3s ease;
        box-shadow: none;
      }
      #attackFlash.flash {
        opacity: 0.35;
      }
      #attackFlash.type-glow {
        opacity: 0;
        transition: opacity 0.4s ease;
        animation: typeGlow 0.6s ease-in-out;
      }
      @keyframes typeGlow {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 0.25;
        }
        100% {
          opacity: 0;
        }
      }

      /* ── CRITICAL HIT OVERLAY ── */
      #critOverlay {
        position: fixed;
        inset: 0;
        z-index: 51;
        pointer-events: none;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #critOverlay.show {
        display: flex;
      }
      .crit-text {
        font-family: var(--display);
        font-size: clamp(40px, 8vw, 80px);
        letter-spacing: 10px;
        color: #ffb830;
        text-shadow:
          0 0 30px #ffb830,
          0 0 60px rgba(255, 184, 48, 0.5);
        animation: critAnim 0.8s ease forwards;
      }
      @keyframes critAnim {
        0% {
          transform: scale(0.5) rotate(-5deg);
          opacity: 0;
        }
        30% {
          transform: scale(1.2) rotate(2deg);
          opacity: 1;
        }
        70% {
          transform: scale(1.05) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 0;
        }
      }

      /* ── NAVBAR PLACEHOLDER ── */
      #navbar-placeholder {
        position: relative;
        z-index: 100;
      }

      /* ── MAIN LAYOUT ── */
      .battle-page {
        position: relative;
        z-index: 10;
        height: calc(100vh - 58px);
        display: grid;
        grid-template-rows: 1fr auto;
        grid-template-columns: 1fr;
        overflow: hidden;
      }

      /* ── ARENA ── */
      .arena {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto 1fr;
        padding: 16px 24px 0;
        gap: 0;
      }

      /* ── POKEMON HUD CARDS ── */
      .pokemon-hud {
        position: relative;
        background: linear-gradient(
          135deg,
          rgba(6, 14, 4, 0.92) 0%,
          rgba(4, 10, 2, 0.96) 100%
        );
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: clamp(8px, 1.5vw, 16px) clamp(12px, 2vw, 20px);
        min-width: clamp(180px, 25vw, 300px);
        max-width: clamp(220px, 30vw, 350px);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.5),
          0 4px 24px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .pokemon-hud::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        width: 14px;
        height: 14px;
        border-top: 2px solid rgba(74, 255, 106, 0.5);
        border-left: 2px solid rgba(74, 255, 106, 0.5);
      }
      .pokemon-hud::after {
        content: "";
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 14px;
        height: 14px;
        border-bottom: 2px solid rgba(74, 255, 106, 0.5);
        border-right: 2px solid rgba(74, 255, 106, 0.5);
      }
      .hud-enemy {
        grid-column: 2;
        grid-row: 1;
        align-self: start;
        justify-self: center;
      }
      .hud-player {
        grid-column: 1;
        grid-row: 1;
        align-self: start;
        justify-self: center;
        margin-top: 8vh;
      }

      .hud-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .hud-name {
        font-family: var(--display);
        font-size: 18px;
        letter-spacing: 3px;
        color: var(--green);
        text-shadow: 0 0 10px rgba(74, 255, 106, 0.3);
      }
      .hud-level {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--text-dim);
        background: rgba(74, 255, 106, 0.06);
        border: 1px solid var(--border-dim);
        padding: 2px 8px;
        border-radius: 2px;
      }
      .hud-status {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 2px;
        padding: 2px 8px;
        border-radius: 2px;
        display: inline-block;
        margin-bottom: 6px;
        display: none;
      }
      .hud-status.psn {
        background: rgba(196, 74, 255, 0.15);
        border: 1px solid rgba(196, 74, 255, 0.4);
        color: #c44aff;
        display: inline-block;
      }
      .hud-status.brn {
        background: rgba(255, 100, 50, 0.15);
        border: 1px solid rgba(255, 100, 50, 0.4);
        color: #ff6432;
        display: inline-block;
      }
      .hud-status.par {
        background: rgba(255, 220, 50, 0.15);
        border: 1px solid rgba(255, 220, 50, 0.4);
        color: #ffdc32;
        display: inline-block;
      }
      .hud-status.slp {
        background: rgba(120, 120, 180, 0.15);
        border: 1px solid rgba(120, 120, 180, 0.4);
        color: #8888cc;
        display: inline-block;
      }

      /* HP Bar */
      .hp-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .hp-label {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 3px;
        color: var(--text-dim);
      }
      .hp-numbers {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 1px;
        color: var(--text);
      }
      .hp-track {
        height: 6px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 3px;
        border: 1px solid rgba(74, 255, 106, 0.1);
        overflow: hidden;
        position: relative;
      }
      .hp-fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #4aff6a, #a0ff80);
        transition:
          width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
          background 0.4s;
        position: relative;
        overflow: hidden;
      }
      .hp-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: hpShine 2s ease-in-out infinite;
      }
      @keyframes hpShine {
        0%,
        100% {
          left: -100%;
        }
        50% {
          left: 150%;
        }
      }
      .hp-fill.yellow {
        background: linear-gradient(90deg, #ffb830, #ffd060);
      }
      .hp-fill.red {
        background: linear-gradient(90deg, #ff4444, #ff7070);
        animation: hpFlicker 0.5s ease-in-out infinite;
      }
      @keyframes hpFlicker {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      /* XP Bar (player only) */
      .xp-row {
        margin-top: 6px;
      }
      .xp-track {
        height: 3px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(74, 180, 255, 0.1);
      }
      .xp-fill {
        height: 100%;
        background: linear-gradient(90deg, #4ab8ff, #80d0ff);
        transition: width 1s ease;
      }
      .xp-label {
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: 2px;
        color: rgba(74, 180, 255, 0.5);
        margin-bottom: 2px;
      }

      /* ── POKEMON SPRITES ── */
      .sprite-zone {
        position: absolute;
        pointer-events: none;
      }
      #enemy-sprite-zone {
        top: 50%;
        right: 15%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(14%, 20%, 24%);
        height: clamp(12%, 18%, 20%);
      }
      #player-sprite-zone {
        top: 80%;
        left: 15%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(16%, 22%, 28%);
        height: clamp(14%, 20%, 24%);
      }
      .pokemon-sprite {
        image-rendering: pixelated;
        filter: drop-shadow(0 8px 20px rgba(74, 255, 106, 0.25));
        transition:
          transform 0.3s ease,
          filter 0.3s;
      }
      #enemy-sprite {
        width: clamp(400%, 400%, 22%);
        height: clamp(400%, 400%, 22%);
        object-fit: contain;
        animation: floatEnemy 3s ease-in-out infinite;
      }
      #player-sprite {
        width: clamp(400%, 400%, 22%);
        height: clamp(400%, 400%, 22%);
        object-fit: contain;
        animation: floatPlayer 3.5s ease-in-out infinite;
        filter: drop-shadow(0 12px 28px rgba(74, 255, 106, 0.3));
      }
      @keyframes floatEnemy {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes floatPlayer {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      /* Attack animations */
      .sprite-hit {
        animation: spriteHit 0.4s ease forwards !important;
      }
      @keyframes spriteHit {
        0% {
          transform: translateX(0) translateY(0);
          filter: brightness(5) saturate(0);
        }
        25% {
          transform: translateX(-18px) translateY(0);
          filter: brightness(3) saturate(0);
        }
        50% {
          transform: translateX(12px) translateY(0);
          filter: brightness(2);
        }
        75% {
          transform: translateX(-8px) translateY(0);
        }
        100% {
          transform: translateX(0) translateY(0);
          filter: none;
        }
      }
      .sprite-attack {
        animation: spriteAttack 0.35s ease forwards !important;
      }
      @keyframes spriteAttack {
        0% {
          transform: translateX(0);
        }
        40% {
          transform: translateX(30px) scale(1.05);
        }
        100% {
          transform: translateX(0) scale(1);
        }
      }
      .enemy-attack {
        animation: enemyAttack 0.35s ease forwards !important;
      }
      @keyframes enemyAttack {
        0% {
          transform: translateX(0);
        }
        40% {
          transform: translateX(-30px) scale(1.05);
        }
        100% {
          transform: translateX(0) scale(1);
        }
      }

      /* Screen shake */
      @keyframes screenShake {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-6px, 3px);
        }
        20% {
          transform: translate(6px, -3px);
        }
        30% {
          transform: translate(-4px, 5px);
        }
        40% {
          transform: translate(4px, -4px);
        }
        50% {
          transform: translate(-3px, 3px);
        }
        60% {
          transform: translate(3px, -2px);
        }
        70% {
          transform: translate(-2px, 2px);
        }
        80% {
          transform: translate(2px, -1px);
        }
        90% {
          transform: translate(-1px, 1px);
        }
      }
      .shake {
        animation: screenShake 0.4s ease;
      }

      /* Particle burst */
      .particle {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 60;
        animation: particleBurst 0.6s ease forwards;
      }
      @keyframes particleBurst {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--px), var(--py)) scale(0);
          opacity: 0;
        }
      }

      /* Turn indicator */
      #turnIndicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        pointer-events: none;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 4px;
        color: rgba(74, 255, 106, 0.6);
        text-transform: uppercase;
        background: rgba(6, 9, 8, 0.8);
        border: 1px solid var(--border-dim);
        padding: 4px 14px;
        border-radius: 2px;
        transition:
          color 0.3s,
          border-color 0.3s;
      }
      #turnIndicator.enemy-turn {
        color: rgba(255, 68, 68, 0.7);
        border-color: rgba(255, 68, 68, 0.2);
      }

      /* ── BOTTOM PANEL ── */
      .bottom-panel {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 0;
        background: linear-gradient(
          180deg,
          rgba(4, 8, 5, 0.95) 0%,
          rgba(6, 10, 6, 0.98) 100%
        );
        border-top: 1px solid var(--border);
        height: 200px;
        position: relative;
        z-index: 20;
      }
      .bottom-panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--green),
          transparent
        );
        opacity: 0.3;
      }

      /* ── BATTLE LOG ── */
      .battle-log-panel {
        padding: 12px 16px;
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .log-header {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 4px;
        color: var(--text-dim);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .log-header::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-dim);
      }
      .log-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 4px var(--green);
        animation: ledBlink 1.5s ease-in-out infinite;
      }
      @keyframes ledBlink {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      .log-scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: rgba(74, 255, 106, 0.2) transparent;
      }
      .log-scroll::-webkit-scrollbar {
        width: 3px;
      }
      .log-scroll::-webkit-scrollbar-thumb {
        background: rgba(74, 255, 106, 0.2);
        border-radius: 2px;
      }
      .log-entry {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 1px;
        line-height: 1.6;
        padding: 2px 0;
        border-bottom: 1px solid rgba(74, 255, 106, 0.04);
        animation: logIn 0.2s ease;
      }
      @keyframes logIn {
        from {
          opacity: 0;
          transform: translateX(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .log-entry.sys {
        color: var(--text-dim);
      }
      .log-entry.info {
        color: var(--text);
      }
      .log-entry.warn {
        color: var(--amber);
      }
      .log-entry.dmg {
        color: var(--red);
      }
      .log-entry.good {
        color: var(--green);
      }
      .log-entry.crit {
        color: #ffb830;
        text-shadow: 0 0 8px rgba(255, 184, 48, 0.4);
        font-weight: bold;
      }

      /* ── ACTION PANEL ── */
      .action-panel {
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .action-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .action-label {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 4px;
        color: var(--text-dim);
      }
      .menu-tabs {
        display: flex;
        gap: 4px;
      }
      .menu-tab {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 2px;
        padding: 3px 10px;
        background: none;
        border: 1px solid var(--border-dim);
        color: var(--text-dim);
        cursor: pointer;
        transition: all 0.15s;
        border-radius: 2px;
      }
      .menu-tab.active,
      .menu-tab:hover {
        border-color: rgba(74, 255, 106, 0.35);
        color: var(--green);
        background: rgba(74, 255, 106, 0.06);
      }
      .menu-tab.danger {
        border-color: rgba(255, 68, 68, 0.2);
        color: rgba(255, 68, 68, 0.6);
      }
      .menu-tab.danger:hover {
        border-color: rgba(255, 68, 68, 0.5);
        color: var(--red);
        background: rgba(255, 68, 68, 0.06);
      }

      /* Move grid */
      .moves-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        flex: 1;
      }
      .move-btn {
        position: relative;
        padding: 0;
        background: none;
        border: none;
        cursor: pointer;
        outline: none;
        transition: transform 0.1s;
        border-radius: 3px;
        overflow: hidden;
      }
      .move-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .move-btn:not(:disabled):active {
        transform: scale(0.97);
      }
      .move-inner {
        background: linear-gradient(
          135deg,
          rgba(6, 14, 4, 0.9) 0%,
          rgba(4, 10, 2, 0.95) 100%
        );
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 8px 12px;
        text-align: left;
        height: 100%;
        transition:
          border-color 0.15s,
          background 0.15s,
          box-shadow 0.15s;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 2px 8px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }
      .move-inner::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.05),
          transparent
        );
        transition: left 0.3s;
      }
      .move-btn:not(:disabled):hover .move-inner::before {
        left: 150%;
      }
      .move-btn:not(:disabled):hover .move-inner {
        border-color: rgba(74, 255, 106, 0.4);
        background: linear-gradient(
          135deg,
          rgba(10, 20, 8, 0.95) 0%,
          rgba(6, 14, 4, 0.98) 100%
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 0 16px rgba(74, 255, 106, 0.1),
          0 4px 12px rgba(0, 0, 0, 0.6);
      }
      /* Type color accent strip */
      .move-inner::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 2px 0 0 2px;
        background: var(--move-color, var(--green));
        box-shadow: 0 0 8px var(--move-color, var(--green));
      }
      .move-name {
        font-family: var(--display);
        font-size: 14px;
        letter-spacing: 2px;
        color: var(--text);
        display: block;
        margin-bottom: 3px;
        padding-left: 8px;
      }
      .move-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-left: 8px;
      }
      .move-type {
        font-family: var(--mono);
        font-size: 7px;
        letter-spacing: 2px;
        padding: 1px 6px;
        border-radius: 2px;
        background: rgba(var(--move-rgb, 74, 255, 106), 0.12);
        border: 1px solid rgba(var(--move-rgb, 74, 255, 106), 0.3);
        color: var(--move-color, var(--green));
        text-transform: uppercase;
      }
      .move-power {
        font-family: var(--mono);
        font-size: 8px;
        color: var(--text-dim);
        letter-spacing: 1px;
      }
      .move-pp {
        font-family: var(--mono);
        font-size: 7px;
        color: var(--text-dim);
        margin-left: auto;
      }

      /* Other menu panels (bag, pokemon, run) */
      .other-panel {
        display: none;
        flex-direction: column;
        gap: 6px;
      }
      .other-panel.active {
        display: flex;
      }
      .other-btn {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 2px;
        padding: 8px 14px;
        background: rgba(6, 14, 4, 0.8);
        border: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
        transition: all 0.15s;
        text-align: left;
        border-radius: 2px;
      }
      .other-btn:hover {
        border-color: rgba(74, 255, 106, 0.35);
        color: var(--green);
      }

      /* ── VICTORY / DEFEAT OVERLAY ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.88);
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal-box {
        background: linear-gradient(160deg, #0e160f, #080d09);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 40px 48px;
        box-shadow: 0 0 60px rgba(74, 255, 106, 0.1);
        position: relative;
        overflow: hidden;
        min-width: 300px;
        max-width: 500px;
      }
      .modal-box::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        width: 18px;
        height: 18px;
        border-top: 2px solid rgba(74, 255, 106, 0.5);
        border-left: 2px solid rgba(74, 255, 106, 0.5);
      }
      .modal-title {
        font-family: var(--display);
        font-size: 24px;
        letter-spacing: 4px;
        color: var(--green);
        text-shadow: 0 0 10px rgba(74, 255, 106, 0.3);
        margin-bottom: 16px;
        text-align: center;
      }
      #endOverlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.88);
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      #endOverlay.show {
        display: flex;
      }
      .end-box {
        background: linear-gradient(160deg, #0e160f, #080d09);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 40px 48px;
        text-align: center;
        box-shadow: 0 0 60px rgba(74, 255, 106, 0.1);
        animation: endBoxIn 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
      }
      @keyframes endBoxIn {
        from {
          opacity: 0;
          transform: scale(0.8) translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .end-box::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        width: 18px;
        height: 18px;
        border-top: 2px solid rgba(74, 255, 106, 0.5);
        border-left: 2px solid rgba(74, 255, 106, 0.5);
      }
      .end-title {
        font-family: var(--display);
        font-size: clamp(36px, 6vw, 56px);
        letter-spacing: 8px;
        margin-bottom: 12px;
      }
      .end-title.victory {
        color: var(--green);
        text-shadow: 0 0 30px rgba(74, 255, 106, 0.5);
      }
      .end-title.defeat {
        color: var(--red);
        text-shadow: 0 0 30px rgba(255, 68, 68, 0.5);
      }
      .end-sub {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--text-dim);
        margin-bottom: 28px;
      }
      .end-xp {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--amber);
        margin-bottom: 20px;
      }
      .end-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .end-btn {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 3px;
        padding: 10px 24px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
      }
      .end-btn.primary {
        background: rgba(74, 255, 106, 0.08);
        border: 1px solid rgba(74, 255, 106, 0.35);
        color: var(--green);
      }
      .end-btn.primary:hover {
        background: rgba(74, 255, 106, 0.16);
        border-color: var(--green);
      }
      .end-btn.secondary {
        background: rgba(255, 184, 48, 0.06);
        border: 1px solid rgba(255, 184, 48, 0.25);
        color: var(--amber);
      }
      .end-btn.secondary:hover {
        background: rgba(255, 184, 48, 0.14);
      }

      /* ── TYPE COLORS ── */
      /* encoded in JS */

      /* ── RESPONSIVE ── */
      @media (max-width: 700px) {
        .arena {
          grid-template-columns: 1fr 1fr;
          padding: 8px;
        }
        .hud-enemy {
          grid-column: 2;
          justify-self: center;
        }
        .hud-player {
          grid-column: 1;
          grid-row: 1;
          justify-self: center;
        }
        .bottom-panel {
          grid-column: 1 / -1;
          grid-template-columns: 1fr;
          height: auto;
        }
        .battle-log-panel {
          grid-column: 1 / -1;
          height: 90px;
          border-right: none;
          border-bottom: 1px solid var(--border-dim);
        }
        #enemy-sprite-zone {
          top: 20%;
          right: clamp(12px, 3vw, 30px);
          transform: translateY(-50%);
          width: clamp(100px, 18vw, 140px);
          height: clamp(100px, 16vw, 140px);
        }
        #player-sprite-zone {
          top: 50%;
          left: clamp(12px, 3vw, 30px);
          transform: translateY(-50%);
          width: clamp(110px, 20vw, 160px);
          height: clamp(110px, 18vw, 160px);
        }
        #enemy-sprite {
          width: clamp(80px, 15vw, 120px);
          height: clamp(80px, 15vw, 120px);
        }
        #player-sprite {
          width: clamp(100px, 18vw, 150px);
          height: clamp(100px, 18vw, 150px);
        }
      }
    </style>
  </head>
  <body>
    <!-- MAP BACKGROUND (from game.html) -->
    <div id="map-bg"></div>
    <div id="map-vignette"></div>

    <!-- BATTLE ARENA BACKGROUNDS -->
    <div id="arena-bg"></div>
    <div id="ground"></div>
    <div id="weather"></div>
    <div id="attackFlash"></div>
    <div id="critOverlay"><span class="crit-text">CRITICAL HIT!</span></div>

    <!-- NAVBAR -->
    <div id="navbar-placeholder"></div>

    <!-- MAIN BATTLE PAGE -->
    <div class="battle-page">
      <!-- ARENA -->
      <div class="arena" id="arenaEl">
        <!-- ENEMY HUD -->
        <div class="pokemon-hud hud-enemy" id="enemyHud">
          <div class="hud-top-row">
            <div class="hud-name" id="enemyName">———</div>
            <div class="hud-level" id="enemyLevel">Lv.??</div>
          </div>
          <div class="hud-status" id="enemyStatus"></div>
          <div class="hp-label-row">
            <div class="hp-label">HP</div>
            <div class="hp-numbers" id="enemyHpNum">— / —</div>
          </div>
          <div class="hp-track">
            <div class="hp-fill" id="enemyHpFill" style="width: 100%"></div>
          </div>
        </div>

        <!-- PLAYER HUD -->
        <div class="pokemon-hud hud-player" id="playerHud">
          <div class="hud-top-row">
            <div class="hud-name" id="playerName">———</div>
            <div class="hud-level" id="playerLevel">Lv.??</div>
          </div>
          <div class="hud-status" id="playerStatus"></div>
          <div class="hp-label-row">
            <div class="hp-label">HP</div>
            <div class="hp-numbers" id="playerHpNum">— / —</div>
          </div>
          <div class="hp-track">
            <div class="hp-fill" id="playerHpFill" style="width: 100%"></div>
          </div>
          <div class="xp-row">
            <div class="xp-label">EXP</div>
            <div class="xp-track">
              <div class="xp-fill" id="xpFill" style="width: 35%"></div>
            </div>
          </div>
        </div>

        <!-- SPRITES -->
        <div class="sprite-zone" id="enemy-sprite-zone">
          <img id="enemy-sprite" class="pokemon-sprite" src="" alt="enemy" />
        </div>
        <div class="sprite-zone" id="player-sprite-zone">
          <img id="player-sprite" class="pokemon-sprite" src="" alt="player" />
        </div>

        <!-- TURN INDICATOR -->
        <div id="turnIndicator">YOUR TURN</div>
      </div>

      <!-- BOTTOM PANEL -->
      <div class="bottom-panel">
        <!-- BATTLE LOG -->
        <div class="battle-log-panel">
          <div class="log-header">
            <div class="log-dot"></div>
            BATTLE LOG
          </div>
          <div class="log-scroll" id="battleLog"></div>
        </div>

        <!-- ACTION PANEL -->
        <div class="action-panel">
          <div class="action-header">
            <div class="action-label">ACTION</div>
            <div class="menu-tabs">
              <button
                class="menu-tab active"
                id="tabFight"
                onclick="switchTab('fight')"
              >
                FIGHT
              </button>
              <button class="menu-tab" id="tabBag" onclick="switchTab('bag')">
                BAG
              </button>
              <button
                class="menu-tab"
                id="tabPoke"
                onclick="switchTab('pokemon')"
              >
                PKM
              </button>
              <button class="menu-tab danger" onclick="tryRun()">RUN</button>
            </div>
          </div>

          <!-- FIGHT panel -->
          <div class="moves-grid" id="fightPanel">
            <!-- populated by JS -->
          </div>

          <!-- BAG panel — PIP capture tools -->
          <div class="other-panel" id="bagPanel">
            <div class="other-btn" onclick="usePIP('basic')">
              ◈ BASIC PIP &nbsp;<span
                style="color: var(--text-dim); float: right"
                id="cnt-basic-pip"
                >×0</span
              >
            </div>
            <div class="other-btn" onclick="usePIP('reinforced')">
              ◈ REINFORCED PIP &nbsp;<span
                style="color: var(--amber); float: right"
                id="cnt-reinforced-pip"
                >×0</span
              >
            </div>
            <div class="other-btn" onclick="usePIP('voss')">
              ◈ VOSS PIP &nbsp;<span
                style="color: var(--blue); float: right"
                id="cnt-voss-pip"
                >×0</span
              >
            </div>
          </div>

          <!-- POKEMON panel -->
          <div class="other-panel" id="pokemonPanel">
            <div class="other-btn" id="pokemonListBtn">Loading party...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- POKEMON SELECTION MODAL -->
    <div class="modal-overlay" id="pokemonSelectionModal">
      <div class="modal-box">
        <div class="modal-title">SELECT YOUR POKÉMON</div>
        <div
          id="pokemonSelectionList"
          style="max-height: 300px; overflow-y: auto; margin: 16px 0"
        >
          <!-- Populated by JS -->
        </div>
        <div
          style="
            text-align: center;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 12px;
            margin-top: 12px;
          "
          id="selectionStatus"
        >
          Loading your party...
        </div>
      </div>
    </div>

    <!-- END OVERLAY -->
    <div id="endOverlay">
      <div class="end-box">
        <div class="end-title" id="endTitle">VICTORY</div>
        <div class="end-sub" id="endSub">BATTLE PROTOCOL COMPLETE</div>
        <div class="end-xp" id="endXp"></div>
        <div class="end-actions">
          <button class="end-btn primary" onclick="goBack()">
            ↩ RETURN TO FIELD
          </button>
          <button class="end-btn secondary" onclick="catchAfterWin()">
            ⬡ CATCH FRAGMENT
          </button>
        </div>
      </div>
    </div>

    <!-- BATTLE LOGIC & SYSTEM -->
    <script src="../assets/js/battle-logic.js"></script>
    <script type="module" src="../assets/js/battle.js"></script>

    <!-- MAP DATA AND BACKGROUND INITIALIZATION -->
    <script>
      // Apply map background from game.html
      function applyMapBackground() {
        const mapInfoJson = sessionStorage.getItem("battleMapInfo");
        const mapBg = document.getElementById("map-bg");

        if (mapInfoJson && mapBg) {
          try {
            const mapInfo = JSON.parse(mapInfoJson);
            // Use the background URL passed from game.html
            mapBg.style.backgroundImage = `url('${mapInfo.bgUrl}')`;
          } catch (e) {
            console.error("Failed to parse map info:", e);
            // Fallback to default
            mapBg.style.backgroundImage = `url('../assets/img/map1.png')`;
          }
        }
      }

      // Initialize on page load
      document.addEventListener("DOMContentLoaded", applyMapBackground);

      // Also initialize immediately in case DOMContentLoaded already fired
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", applyMapBackground);
      } else {
        applyMapBackground();
      }
    </script>
    <script>
      fetch("navbar.html")
        .then((r) => r.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
          if (typeof window.attachLogoutHandler === "function")
            window.attachLogoutHandler();
          if (typeof window.loadProfileName === "function")
            window.loadProfileName();
          if (typeof window.updateWPCBalance === "function")
            window.updateWPCBalance();
        });
    </script>
  </body>
</html>
