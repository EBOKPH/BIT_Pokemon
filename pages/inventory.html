<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIP — Fragment Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green:      #4aff6a;
      --green-dim:  rgba(74,255,106,0.15);
      --green-dark: #0a1f0f;
      --amber:      #ffb830;
      --red:        #ff4444;
      --blue:       #44aaff;
      --purple:     #b450ff;
      --bg:         #0a0c08;
      --panel:      #111408;
      --border:     rgba(74,255,106,0.18);
      --border-dim: rgba(74,255,106,0.08);
      --text:       #c8e8a0;
      --text-dim:   #4a6a38;
      --mono:       "Share Tech Mono", monospace;
      --ui:         "Rajdhani", sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; min-height:100%; overflow:auto;
      background:var(--bg); font-family:var(--ui);
      color:var(--text); user-select:none;
    }

    /* Scanlines */
    body::before {
      content:""; position:fixed; inset:0; z-index:1000; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
    }
    /* Vignette */
    body::after {
      content:""; position:fixed; inset:0; z-index:999; pointer-events:none;
      background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.6) 100%);
    }

    #navbar-placeholder { position:relative; z-index:100; }

    /* ── PAGE ── */
    .inv-page {
      position:relative; z-index:1;
      min-height:calc(100vh - 58px);
      background:
        radial-gradient(ellipse 55% 35% at 50% 20%, rgba(30,50,10,.22) 0%, transparent 70%),
        radial-gradient(ellipse 100% 50% at 50% 100%, rgba(0,0,0,.75) 0%, transparent 60%),
        var(--bg);
      padding:22px 28px 60px;
    }

    /* ── HEADER ── */
    .inv-header {
      display:flex; align-items:flex-start; justify-content:space-between;
      margin-bottom:20px; padding-bottom:16px;
      border-bottom:1px solid var(--border);
      gap:16px; flex-wrap:wrap;
    }
    .inv-header-left { display:flex; flex-direction:column; gap:4px; }
    .inv-title {
      font-family:"Bebas Neue",sans-serif; font-size:34px; letter-spacing:5px;
      color:var(--green); line-height:1;
      text-shadow:0 0 28px rgba(74,255,106,.35);
    }
    .inv-subtitle {
      font-family:var(--mono); font-size:10px; letter-spacing:3px;
      color:var(--text-dim);
    }

    /* Capture device counts row */
    .device-counts {
      display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;
    }
    .device-pill {
      display:flex; align-items:center; gap:10px;
      background:rgba(0,0,0,.4); border:1px solid var(--border-dim);
      padding:7px 14px; position:relative; overflow:hidden;
    }
    .device-pill::before {
      content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
    }
    .device-pill.tier-1::before { background:var(--green); }
    .device-pill.tier-2::before { background:var(--blue); }
    .device-pill.tier-3::before { background:var(--purple); }
    .device-pill.tier-4::before { background:var(--amber); }
    .device-pill-icon {
      font-size:18px; line-height:1; opacity:.8;
    }
    .device-pill-info { display:flex; flex-direction:column; }
    .device-pill-name {
      font-family:var(--mono); font-size:8px; letter-spacing:2px;
      text-transform:uppercase; line-height:1; margin-bottom:2px;
    }
    .device-pill.tier-1 .device-pill-name { color:rgba(74,255,106,.6); }
    .device-pill.tier-2 .device-pill-name { color:rgba(68,170,255,.6); }
    .device-pill.tier-3 .device-pill-name { color:rgba(180,80,255,.6); }
    .device-pill.tier-4 .device-pill-name { color:rgba(255,184,48,.6); }
    .device-pill-qty {
      font-family:"Bebas Neue",sans-serif; font-size:20px; letter-spacing:2px; line-height:1;
    }
    .device-pill.tier-1 .device-pill-qty { color:var(--green); }
    .device-pill.tier-2 .device-pill-qty { color:var(--blue); }
    .device-pill.tier-3 .device-pill-qty { color:var(--purple); }
    .device-pill.tier-4 .device-pill-qty { color:var(--amber); }

    /* Right meta */
    .inv-meta { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .inv-badge {
      font-family:var(--mono); font-size:10px; letter-spacing:2px;
      color:var(--text-dim); padding:5px 12px;
      border:1px solid var(--border-dim);
      background:rgba(74,255,106,.04);
    }
    .inv-badge span { color:var(--green); }
    .back-btn {
      font-family:"Bebas Neue",sans-serif; font-size:13px; letter-spacing:5px;
      color:var(--text-dim); background:none;
      border:1px solid rgba(74,255,106,.15); padding:7px 18px;
      cursor:pointer; transition:all .15s;
    }
    .back-btn:hover { color:var(--green); border-color:var(--green); box-shadow:0 0 14px rgba(74,255,106,.18); }

    /* ── TABS ── */
    .inv-tabs {
      display:flex; margin-bottom:18px;
      border-bottom:1px solid var(--border);
    }
    .tab-btn {
      font-family:"Bebas Neue",sans-serif; font-size:14px; letter-spacing:4px;
      color:var(--text-dim); background:none; border:none;
      padding:10px 24px; cursor:pointer;
      border-bottom:2px solid transparent; margin-bottom:-1px;
      transition:color .15s;
    }
    .tab-btn:hover { color:var(--text); }
    .tab-btn.active { color:var(--green); border-bottom-color:var(--green); }
    .tab-count {
      font-family:var(--mono); font-size:9px; margin-left:6px;
      padding:1px 5px; background:rgba(74,255,106,.08); color:var(--text-dim);
    }
    .tab-btn.active .tab-count { color:var(--green); background:rgba(74,255,106,.15); }

    /* ── FILTER BAR ── */
    .inv-filter {
      display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;
    }
    .filter-search {
      flex:1; min-width:180px; max-width:300px;
      font-family:var(--mono); font-size:12px; letter-spacing:1px;
      color:var(--text); background:rgba(0,0,0,.4);
      border:1px solid var(--border-dim); border-left:2px solid rgba(74,255,106,.3);
      padding:8px 12px; outline:none; transition:all .2s;
    }
    .filter-search:focus { border-color:rgba(74,255,106,.4); border-left-color:var(--green); }
    .filter-search::placeholder { color:var(--text-dim); }
    .sort-lbl { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--text-dim); }
    .sort-sel {
      font-family:var(--mono); font-size:11px; color:var(--text);
      background:rgba(0,0,0,.5); border:1px solid var(--border-dim);
      padding:7px 10px; outline:none; cursor:pointer;
    }
    .sort-sel option { background:#111408; }
    .refresh-btn {
      font-family:var(--mono); font-size:11px; letter-spacing:2px;
      color:var(--text-dim); background:none;
      border:1px solid var(--border-dim); padding:7px 14px;
      cursor:pointer; transition:all .15s;
    }
    .refresh-btn:hover { color:var(--green); border-color:rgba(74,255,106,.3); }

    /* ── GRID ── */
    .inv-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(155px, 1fr));
      gap:12px;
      padding-bottom:40px;
    }

    /* ── ITEM CARD ── */
    .item-card {
      background:linear-gradient(160deg,rgba(18,26,10,.95) 0%,rgba(8,12,4,.98) 100%);
      border:1px solid var(--border-dim);
      position:relative; cursor:pointer;
      transition:transform .15s, border-color .15s, box-shadow .15s;
      overflow:hidden;
    }
    .item-card::after {
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg,rgba(74,255,106,.025) 0%,transparent 55%);
      pointer-events:none;
    }
    /* Corner brackets */
    .cc { position:absolute; width:7px; height:7px; }
    .cc.tl { top:4px; left:4px;  border-top:1px solid rgba(74,255,106,.22); border-left:1px solid rgba(74,255,106,.22); }
    .cc.tr { top:4px; right:4px; border-top:1px solid rgba(74,255,106,.22); border-right:1px solid rgba(74,255,106,.22); }
    .cc.bl { bottom:4px; left:4px;  border-bottom:1px solid rgba(74,255,106,.22); border-left:1px solid rgba(74,255,106,.22); }
    .cc.br { bottom:4px; right:4px; border-bottom:1px solid rgba(74,255,106,.22); border-right:1px solid rgba(74,255,106,.22); }

    .item-card:hover { transform:translateY(-3px); border-color:rgba(74,255,106,.35); box-shadow:0 6px 24px rgba(74,255,106,.1); }

    /* rarity border colours */
    .r-common     { border-color:rgba(74,255,106,.12); }
    .r-uncommon   { border-color:rgba(80,200,120,.2); }
    .r-rare       { border-color:rgba(68,170,255,.2); }
    .r-epic       { border-color:rgba(180,80,255,.2); }
    .r-legendary  { border-color:rgba(255,184,48,.25); }
    .r-rare:hover       { border-color:rgba(68,170,255,.55);  box-shadow:0 6px 24px rgba(68,170,255,.14); }
    .r-epic:hover       { border-color:rgba(180,80,255,.55);  box-shadow:0 6px 24px rgba(180,80,255,.14); }
    .r-legendary:hover  { border-color:rgba(255,184,48,.65);  box-shadow:0 6px 24px rgba(255,184,48,.2); }

    .card-img {
      width:100%; aspect-ratio:1/1;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.28); padding:16px; position:relative;
    }
    .card-img img {
      width:68px; height:68px; object-fit:contain; image-rendering:pixelated;
      filter:drop-shadow(0 0 7px rgba(74,255,106,.2));
      transition:transform .18s, filter .18s;
    }
    .item-card:hover .card-img img { transform:scale(1.1); filter:drop-shadow(0 0 14px rgba(74,255,106,.45)); }
    .r-rare .card-img img       { filter:drop-shadow(0 0 7px rgba(68,170,255,.3)); }
    .r-epic .card-img img       { filter:drop-shadow(0 0 7px rgba(180,80,255,.3)); }
    .r-legendary .card-img img  { filter:drop-shadow(0 0 10px rgba(255,184,48,.4)); }

    .qty-tag {
      position:absolute; bottom:5px; right:6px;
      font-family:var(--mono); font-size:11px; font-weight:700;
      color:#000; padding:1px 7px; line-height:1.5;
    }
    .r-common .qty-tag, .r-uncommon .qty-tag { background:var(--green); }
    .r-rare .qty-tag    { background:var(--blue); }
    .r-epic .qty-tag    { background:var(--purple); }
    .r-legendary .qty-tag { background:var(--amber); }

    .card-body { padding:9px 11px 11px; border-top:1px solid var(--border-dim); }
    .card-name {
      font-family:"Bebas Neue",sans-serif; font-size:14px; letter-spacing:2px;
      color:var(--text); line-height:1.1; margin-bottom:3px;
    }
    .card-type {
      font-family:var(--mono); font-size:9px; letter-spacing:2px;
      color:var(--text-dim); text-transform:uppercase; margin-bottom:5px;
    }
    .card-rarity-tag {
      font-family:var(--mono); font-size:8px; letter-spacing:2px;
      padding:2px 6px; display:inline-block; text-transform:uppercase;
    }
    .r-common   .card-rarity-tag { color:rgba(74,255,106,.7);  background:rgba(74,255,106,.07);  border:1px solid rgba(74,255,106,.15); }
    .r-uncommon .card-rarity-tag { color:rgba(80,200,120,.75); background:rgba(80,200,120,.07);  border:1px solid rgba(80,200,120,.18); }
    .r-rare     .card-rarity-tag { color:rgba(68,170,255,.8);  background:rgba(68,170,255,.07);  border:1px solid rgba(68,170,255,.18); }
    .r-epic     .card-rarity-tag { color:rgba(180,80,255,.8);  background:rgba(180,80,255,.07);  border:1px solid rgba(180,80,255,.18); }
    .r-legendary .card-rarity-tag{ color:var(--amber);          background:rgba(255,184,48,.07);  border:1px solid rgba(255,184,48,.22); }

    /* ── POKEMON CARDS ── */
    .poke-card {
      background:linear-gradient(160deg,rgba(18,26,10,.95) 0%,rgba(8,12,4,.98) 100%);
      border:1px solid var(--border-dim);
      position:relative; overflow:hidden; cursor:pointer;
      transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .poke-card:hover { transform:translateY(-3px); border-color:rgba(74,255,106,.35); box-shadow:0 6px 24px rgba(74,255,106,.1); }
    .poke-img {
      width:100%; aspect-ratio:1/1; background:rgba(0,0,0,.32);
      display:flex; align-items:center; justify-content:center; padding:10px;
    }
    .poke-img img {
      width:92px; height:92px; object-fit:contain;
      filter:drop-shadow(0 0 10px rgba(74,255,106,.18));
      transition:transform .18s;
    }
    .poke-card:hover .poke-img img { transform:scale(1.07); }
    .poke-body { padding:9px 11px 11px; border-top:1px solid var(--border-dim); }
    .poke-name { font-family:"Bebas Neue",sans-serif; font-size:16px; letter-spacing:2px; color:var(--text); }
    .poke-dex  { font-family:var(--mono); font-size:9px; color:var(--text-dim); letter-spacing:2px; margin-bottom:6px; }
    .poke-pills { display:flex; gap:5px; flex-wrap:wrap; }
    .poke-pill {
      font-family:var(--mono); font-size:8px; letter-spacing:1px;
      color:rgba(74,255,106,.65); background:rgba(74,255,106,.07);
      border:1px solid rgba(74,255,106,.12); padding:2px 6px;
    }
    .poke-pill.shiny { color:var(--amber); background:rgba(255,184,48,.07); border-color:rgba(255,184,48,.2); }

    /* ── EMPTY / LOADING ── */
    .state-msg {
      grid-column:1/-1;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:10px; padding:80px 20px;
    }
    .state-icon { font-size:38px; opacity:.3; }
    .state-title {
      font-family:"Bebas Neue",sans-serif; font-size:20px; letter-spacing:4px; color:var(--text-dim);
    }
    .state-sub { font-family:var(--mono); font-size:9px; letter-spacing:2px; color:rgba(74,255,106,.2); }
    .spin {
      width:18px; height:18px;
      border:2px solid var(--border-dim); border-top-color:var(--green);
      border-radius:50%; animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── STATUS BAR ── */
    .statusbar {
      position:fixed; bottom:0; left:0; right:0; height:24px; z-index:50;
      background:rgba(8,10,6,.96); border-top:1px solid var(--border-dim);
      display:flex; align-items:center; gap:22px; padding:0 18px;
      font-family:var(--mono); font-size:9px; letter-spacing:2px; color:var(--text-dim);
    }
    .sb-dot { width:5px; height:5px; border-radius:50%; background:var(--green); display:inline-block; margin-right:5px; animation:sbp 2s ease-in-out infinite; }
    @keyframes sbp { 0%,100%{opacity:.35;} 50%{opacity:1;} }
    .sb-val { color:var(--green); }

    /* ── DRAWER ── */
    .drawer-overlay {
      display:none; position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,.78); backdrop-filter:blur(3px);
    }
    .drawer-overlay.open { display:flex; align-items:center; justify-content:center; }
    .drawer {
      background:linear-gradient(160deg,#0e1208 0%,#080c04 100%);
      border:1px solid var(--border);
      width:min(460px,92vw); max-height:82vh; overflow-y:auto;
      position:relative;
      box-shadow:0 0 60px rgba(74,255,106,.08), 0 24px 80px rgba(0,0,0,.9);
    }
    .drawer-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:13px 16px; border-bottom:1px solid var(--border-dim);
      background:rgba(74,255,106,.03); position:sticky; top:0; z-index:1;
    }
    .drawer-title {
      font-family:"Bebas Neue",sans-serif; font-size:20px; letter-spacing:4px; color:var(--green);
    }
    .drawer-x {
      background:none; border:1px solid var(--border-dim); color:var(--text-dim);
      width:26px; height:26px; cursor:pointer; font-size:12px;
      display:flex; align-items:center; justify-content:center; transition:all .15s;
    }
    .drawer-x:hover { border-color:var(--red); color:var(--red); }
    .drawer-content { padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
    .d-img {
      display:flex; align-items:center; justify-content:center;
      padding:22px; background:rgba(0,0,0,.3); border:1px solid var(--border-dim);
    }
    .d-img img { width:110px; height:110px; object-fit:contain; image-rendering:auto; filter:drop-shadow(0 0 18px rgba(74,255,106,.25)); }
    .d-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:7px 0; border-bottom:1px solid var(--border-dim);
      font-family:var(--mono); font-size:11px; letter-spacing:1px;
    }
    .d-row:last-child { border:none; }
    .d-lbl { color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; font-size:9px; }
    .d-val { color:var(--text); }
    .d-desc {
      font-family:var(--mono); font-size:11px; line-height:1.7;
      color:rgba(200,232,160,.45); padding:10px 12px;
      border:1px solid var(--border-dim); background:rgba(0,0,0,.2);
    }
    /* Action buttons in drawer */
    .d-actions { display:flex; gap:8px; margin-top:4px; }
    .d-btn {
      flex:1; font-family:"Bebas Neue",sans-serif; font-size:14px; letter-spacing:3px;
      padding:9px 12px; border:none; cursor:pointer; transition:all .15s;
    }
    .d-btn.use  { background:rgba(74,255,106,.15); color:var(--green); border:1px solid rgba(74,255,106,.25); }
    .d-btn.use:hover  { background:rgba(74,255,106,.25); }
    .d-btn.drop { background:rgba(255,68,68,.1); color:var(--red); border:1px solid rgba(255,68,68,.2); }
    .d-btn.drop:hover { background:rgba(255,68,68,.2); }
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="inv-page">

  <!-- Header -->
  <div class="inv-header">
    <div class="inv-header-left">
      <div class="inv-title">Fragment Vault</div>
      <div class="inv-subtitle">// hunter inventory · field registry</div>
      <!-- Capture Device counts pulled from user profile -->
      <div class="device-counts">
        <div class="device-pill tier-1">
          <div class="device-pill-icon">⚡</div>
          <div class="device-pill-info">
            <div class="device-pill-name">Capture Mk.I</div>
            <div class="device-pill-qty" id="cnt-pokeball">—</div>
          </div>
        </div>
        <div class="device-pill tier-2">
          <div class="device-pill-icon">⚡</div>
          <div class="device-pill-info">
            <div class="device-pill-name">Capture Mk.II</div>
            <div class="device-pill-qty" id="cnt-greatball">—</div>
          </div>
        </div>
        <div class="device-pill tier-3">
          <div class="device-pill-icon">⚡</div>
          <div class="device-pill-info">
            <div class="device-pill-name">Capture Mk.III</div>
            <div class="device-pill-qty" id="cnt-ultraball">—</div>
          </div>
        </div>
        <div class="device-pill tier-4">
          <div class="device-pill-icon">💠</div>
          <div class="device-pill-info">
            <div class="device-pill-name">Capture APEX</div>
            <div class="device-pill-qty" id="cnt-masterball">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="inv-meta">
      <div class="inv-badge">Hunter: <span id="hunterIgn">—</span></div>
      <div class="inv-badge">WPC: <span id="wpcBal">—</span></div>
      <button class="back-btn" onclick="window.location.href='pip_interface.html'">◀ PIP Interface</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="inv-tabs">
    <button class="tab-btn active" onclick="switchTab('items',this)">
      Field Items <span class="tab-count" id="cntItems">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('pokemon',this)">
      Fragments <span class="tab-count" id="cntPoke">0</span>
    </button>
  </div>

  <!-- Filter bar -->
  <div class="inv-filter">
    <input class="filter-search" id="searchInput" placeholder="SEARCH VAULT..." oninput="applyFilter()" autocomplete="off" spellcheck="false"/>
    <div class="sort-lbl">SORT:</div>
    <select class="sort-sel" id="sortSel" onchange="applyFilter()">
      <option value="name">Name A–Z</option>
      <option value="qty_desc">Qty ↓</option>
      <option value="qty_asc">Qty ↑</option>
    </select>
    <button class="refresh-btn" onclick="reload()">↻ REFRESH</button>
  </div>

  <!-- Grid -->
  <div class="inv-grid" id="invGrid">
    <div class="state-msg">
      <div class="spin"></div>
      <div class="state-title">Loading Vault</div>
      <div class="state-sub">// fetching hunter inventory...</div>
    </div>
  </div>

</div>

<!-- Status bar -->
<div class="statusbar">
  <span><span class="sb-dot"></span>VAULT ONLINE</span>
  <span>FIELD ITEMS: <span class="sb-val" id="sb-items">—</span></span>
  <span>FRAGMENTS: <span class="sb-val" id="sb-poke">—</span></span>
  <span>UID: <span class="sb-val" id="sb-uid">—</span></span>
  <span style="margin-left:auto" id="sb-clock">—</span>
</div>

<!-- Item Drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="overlayClick(event)">
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-title" id="dTitle">—</div>
      <button class="drawer-x" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-content" id="dContent"></div>
  </div>
</div>

<script type="module">
import { API_BASE_URL } from '../api.js';
window._API = API_BASE_URL;

// ── Auth ─────────────────────────────────────────────────
const user_id = localStorage.getItem('user_id');
const token   = localStorage.getItem('token');
if (!user_id || !token) { window.location.href = '../index.html'; }

// ── State ────────────────────────────────────────────────
let allItems   = [];
let allPokemon = [];
let activeTab  = 'items';

// ── Item type labels (lore-accurate display names) ───────
const TYPE_LABELS = {
  capture_device: 'Capture Device',
  booster:        'Field Booster',
  pip_upgrade:    'PIP Upgrade',
  utility:        'Utility',
  pokeball:       'Capture Device',   // legacy fallback
};

// ── Item icon map by SKU then type ───────────────────────
// Since Capture Devices are custom tech (no PokeAPI sprite),
// we use SVG data URIs rendered inline as card icons.
const TYPE_ICONS = {
  capture_device: '⚡',
  booster:        '📡',
  pip_upgrade:    '🔧',
  utility:        '🔄',
};

// SKU → icon override
const SKU_ICONS = {
  'CAPTURE-MK1':   '⚡',
  'CAPTURE-MK2':   '⚡',
  'CAPTURE-MK3':   '⚡',
  'CAPTURE-APEX':  '💠',
  'BOOST-NEURAL':  '⚡',
  'BOOST-XP':      '📡',
  'BOOST-SIGLOCK': '🔒',
  'BOOST-WARD':    '🛡',
  'UPGRADE-SLOT':  '🔧',
  'UPGRADE-BEAM':  '📻',
  'UPGRADE-MEM':   '💾',
  'UTIL-RESET':    '🔄',
  'UTIL-SCRAMBLE': '📶',
};

// Returns either an image URL (if item has image_url) or null
// Card will render icon instead when no image
function itemImageUrl(item) {
  return item.image_url || null;
}
function itemIcon(item) {
  return SKU_ICONS[item.sku] || TYPE_ICONS[item.item_type] || '📦';
}
function itemTypeLabel(item) {
  return TYPE_LABELS[item.item_type] || (item.item_type || 'misc');
}

// ── Clock ────────────────────────────────────────────────
setInterval(() => { document.getElementById('sb-clock').textContent = new Date().toTimeString().slice(0,8); }, 1000);
document.getElementById('sb-uid').textContent = `UID-${user_id}`;

// ── Fetch helpers ────────────────────────────────────────
async function get(path) {
  const r = await fetch(`${window._API}${path}`, { headers:{ Authorization:`Bearer ${token}` } });
  return r.json();
}
async function del(path) {
  const r = await fetch(`${window._API}${path}`, { method:'DELETE', headers:{ Authorization:`Bearer ${token}` } });
  return r.json();
}

// ── Load profile ─────────────────────────────────────────
async function loadProfile() {
  try {
    const res = await get(`/users/${user_id}`);
    if (res.success && res.data) {
      const d = res.data;
      document.getElementById('hunterIgn').textContent = d.ign || d.username || '—';
      document.getElementById('wpcBal').textContent    = d.user_ingame_wallet ?? 0;
      document.getElementById('cnt-pokeball').textContent  = d.pokeball  ?? 0;
      document.getElementById('cnt-greatball').textContent = d.greatball ?? 0;
      document.getElementById('cnt-ultraball').textContent = d.ultraball ?? 0;
      document.getElementById('cnt-masterball').textContent= d.masterball ?? 0;
    }
  } catch(e) {}
}

// ── Load items from user_inventory_detailed view ─────────
async function loadItems() {
  try {
    const res = await get(`/items/inventory/${user_id}`);
    allItems = (res.success && res.data) ? res.data : [];
  } catch(e) { allItems = []; }
  document.getElementById('cntItems').textContent = allItems.length;
  document.getElementById('sb-items').textContent = allItems.length;
}

// ── Load Pokémon ─────────────────────────────────────────
async function loadPokemon() {
  try {
    const res = await get(`/users/${user_id}/pokemon`);
    allPokemon = (res.success && res.data) ? res.data : [];
  } catch(e) { allPokemon = []; }
  document.getElementById('cntPoke').textContent = allPokemon.length;
  document.getElementById('sb-poke').textContent = allPokemon.length;
}

// ── Render items ─────────────────────────────────────────
function renderItems(list) {
  const grid = document.getElementById('invGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="state-msg">
      <div class="state-icon">📦</div>
      <div class="state-title">Vault Empty</div>
      <div class="state-sub">// no items found</div>
    </div>`; return;
  }
  grid.innerHTML = list.map(item => {
    const rarity   = (item.rarity || 'common').toLowerCase();
    const icon     = itemIcon(item);
    const imgUrl   = itemImageUrl(item);
    const typeDisp = itemTypeLabel(item);
    const safe     = encodeURIComponent(JSON.stringify(item));
    const restricted = item.restricted ? `<span style="font-family:var(--mono);font-size:8px;letter-spacing:2px;color:rgba(255,68,68,.7);border:1px solid rgba(255,68,68,.2);padding:1px 5px;">RESTRICTED</span>` : '';
    const imgContent = imgUrl
      ? `<img src="${imgUrl}" alt="${item.item_name||'item'}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
         <div class="card-icon-fallback" style="display:none;font-size:40px;line-height:1">${icon}</div>`
      : `<div style="font-size:42px;line-height:1;filter:drop-shadow(0 0 8px currentColor)">${icon}</div>`;
    return `<div class="item-card r-${rarity}" onclick="openItem('${safe}')">
      <span class="cc tl"></span><span class="cc tr"></span>
      <span class="cc bl"></span><span class="cc br"></span>
      <div class="card-img">
        ${imgContent}
        <div class="qty-tag">×${item.quantity ?? 0}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${item.item_name || `Item #${item.item_id}`}</div>
        <div class="card-type">${typeDisp}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
          <div class="card-rarity-tag">${rarity}</div>
          ${restricted}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Render pokémon ────────────────────────────────────────
function renderPokemon(list) {
  const grid = document.getElementById('invGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="state-msg">
      <div class="state-icon">🔮</div>
      <div class="state-title">No Fragments</div>
      <div class="state-sub">// no encoded fragments in vault</div>
    </div>`; return;
  }
  const ART = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
  grid.innerHTML = list.map(p => {
    const sprite = p.sprite || ART(p.pokedex_no || p.pokemon_id || 0);
    const name   = p.nickname || p.name || `#${p.pokedex_no||'?'}`;
    const dex    = p.pokedex_no ? `NO.${String(p.pokedex_no).padStart(3,'0')}` : '';
    const types  = Array.isArray(p.types) ? p.types : (p.types ? String(p.types).split(',') : []);
    const safe   = encodeURIComponent(JSON.stringify(p));
    return `<div class="poke-card" onclick="openPoke('${safe}')">
      <span class="cc tl"></span><span class="cc tr"></span>
      <span class="cc bl"></span><span class="cc br"></span>
      <div class="poke-img">
        <img src="${sprite}" alt="${name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'"/>
      </div>
      <div class="poke-body">
        <div class="poke-name">${name}</div>
        <div class="poke-dex">${dex}</div>
        <div class="poke-pills">
          <span class="poke-pill">LV.${p.level||1}</span>
          ${types.map(t=>`<span class="poke-pill">${String(t).trim().toUpperCase()}</span>`).join('')}
          ${p.is_shiny ? '<span class="poke-pill shiny">★ SHINY</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Filter + Sort ────────────────────────────────────────
window.applyFilter = function() {
  const q    = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSel').value;
  if (activeTab === 'items') {
    let list = allItems.filter(i =>
      (i.item_name||'').toLowerCase().includes(q) ||
      (i.item_type||'').toLowerCase().includes(q) ||
      (i.hunter||'').toLowerCase().includes(q)
    );
    if (sort === 'name')     list.sort((a,b)=>(a.item_name||'').localeCompare(b.item_name||''));
    if (sort === 'qty_desc') list.sort((a,b)=>(b.quantity||0)-(a.quantity||0));
    if (sort === 'qty_asc')  list.sort((a,b)=>(a.quantity||0)-(b.quantity||0));
    renderItems(list);
  } else {
    let list = allPokemon.filter(p =>
      (p.name||p.nickname||'').toLowerCase().includes(q) ||
      String(p.types||'').toLowerCase().includes(q)
    );
    if (sort === 'name')     list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    if (sort === 'qty_desc') list.sort((a,b)=>(b.level||0)-(a.level||0));
    if (sort === 'qty_asc')  list.sort((a,b)=>(a.level||0)-(b.level||0));
    renderPokemon(list);
  }
};

window.switchTab = function(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';
  applyFilter();
};

window.reload = async function() {
  document.getElementById('invGrid').innerHTML = `<div class="state-msg"><div class="spin"></div><div class="state-title">Refreshing</div></div>`;
  await Promise.all([loadItems(), loadPokemon(), loadProfile()]);
  applyFilter();
};

// ── Item drawer ──────────────────────────────────────────
window.openItem = function(safe) {
  const item     = JSON.parse(decodeURIComponent(safe));
  const icon     = itemIcon(item);
  const imgUrl   = itemImageUrl(item);
  const typeDisp = itemTypeLabel(item);
  const rarity   = (item.rarity || 'common').toUpperCase();

  const imgBlock = imgUrl
    ? `<div class="d-img"><img src="${imgUrl}" alt="${item.item_name||''}"/></div>`
    : `<div class="d-img"><div style="font-size:72px;line-height:1;text-align:center">${icon}</div></div>`;

  document.getElementById('dTitle').textContent = (item.item_name || 'Item').toUpperCase();
  document.getElementById('dContent').innerHTML = `
    ${imgBlock}
    <div class="d-row"><span class="d-lbl">Name</span><span class="d-val">${item.item_name || '—'}</span></div>
    <div class="d-row"><span class="d-lbl">Category</span><span class="d-val">${typeDisp}</span></div>
    <div class="d-row"><span class="d-lbl">SKU</span><span class="d-val" style="color:var(--text-dim)">${item.sku || '—'}</span></div>
    <div class="d-row"><span class="d-lbl">Rarity</span><span class="d-val">${rarity}</span></div>
    ${item.tier ? `<div class="d-row"><span class="d-lbl">Tier</span><span class="d-val">MK.${item.tier}</span></div>` : ''}
    <div class="d-row"><span class="d-lbl">Quantity</span><span class="d-val" style="color:var(--green);font-size:20px;font-family:'Bebas Neue',sans-serif;letter-spacing:2px">×${item.quantity ?? 0}</span></div>
    ${item.price ? `<div class="d-row"><span class="d-lbl">Price</span><span class="d-val">${item.price} ${item.currency || 'FRG'}</span></div>` : ''}
    ${item.duration ? `<div class="d-row"><span class="d-lbl">Duration</span><span class="d-val">${item.duration}</span></div>` : ''}
    ${item.permanent ? `<div class="d-row"><span class="d-lbl">Type</span><span class="d-val" style="color:var(--amber)">Permanent Upgrade</span></div>` : ''}
    ${item.restricted ? `<div class="d-row"><span class="d-lbl">Status</span><span class="d-val" style="color:var(--red)">⚠ RESTRICTED — Ironclad-monitored</span></div>` : ''}
    <div class="d-row"><span class="d-lbl">Acquired</span><span class="d-val">${item.acquired_at ? new Date(item.acquired_at).toLocaleDateString() : '—'}</span></div>
    ${item.effect ? `<div class="d-desc">// EFFECT — ${item.effect}</div>` : ''}
    ${item.description ? `<div class="d-desc">// ${item.description}</div>` : ''}
    <div class="d-actions">
      <button class="d-btn drop" onclick="dropItem(${item.item_id})">✕ Discard from Vault</button>
    </div>
  `;
  document.getElementById('drawerOverlay').classList.add('open');
};

// ── Pokémon drawer ───────────────────────────────────────
window.openPoke = function(safe) {
  const p      = JSON.parse(decodeURIComponent(safe));
  const ART    = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
  const sprite = p.sprite || ART(p.pokedex_no || p.pokemon_id || 0);
  const name   = p.nickname || p.name || 'Unknown Fragment';
  const types  = Array.isArray(p.types) ? p.types.join(' / ') : (p.types || '—');
  const dexNo  = p.pokedex_no ? '#' + String(p.pokedex_no).padStart(3,'0') : '—';
  document.getElementById('dTitle').textContent = name.toUpperCase();
  document.getElementById('dContent').innerHTML = `
    <div class="d-img"><img src="${sprite}" alt="${name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'"/></div>
    <div class="d-row"><span class="d-lbl">Fragment Signal</span><span class="d-val" style="color:var(--green)">${dexNo}</span></div>
    <div class="d-row"><span class="d-lbl">Designation</span><span class="d-val">${name}</span></div>
    <div class="d-row"><span class="d-lbl">Nickname</span><span class="d-val">${p.nickname || '—'}</span></div>
    <div class="d-row"><span class="d-lbl">Signal Type</span><span class="d-val">${types}</span></div>
    <div class="d-row"><span class="d-lbl">Power Level</span><span class="d-val" style="color:var(--green)">LV.${p.level || 1}</span></div>
    <div class="d-row"><span class="d-lbl">Signal Integrity</span><span class="d-val">${p.current_hp ?? '—'} / ${p.max_hp || '—'}</span></div>
    <div class="d-row"><span class="d-lbl">Nature Matrix</span><span class="d-val">${p.nature || '—'}</span></div>
    <div class="d-row"><span class="d-lbl">Chip Status</span><span class="d-val">${p.status || 'ACTIVE'}</span></div>
    <div class="d-row"><span class="d-lbl">Corrupted</span><span class="d-val" style="color:${p.is_shiny ? 'var(--amber)' : 'var(--text-dim)'}">${p.is_shiny ? '★ ANOMALY DETECTED' : 'Clean signal'}</span></div>
    <div class="d-row"><span class="d-lbl">Re-encoded</span><span class="d-val">${p.caught_at ? new Date(p.caught_at).toLocaleDateString() : '—'}</span></div>
  `;
  document.getElementById('drawerOverlay').classList.add('open');
};

// ── Drop item (DELETE) ───────────────────────────────────
window.dropItem = async function(item_id) {
  if (!confirm('Remove this item from your vault?')) return;
  try {
    const res = await del(`/items/inventory/${user_id}/${item_id}`);
    if (res.success) {
      closeDrawer();
      await loadItems();
      applyFilter();
    } else {
      alert(res.message || 'Failed to remove item');
    }
  } catch(e) { alert('Network error'); }
};

window.closeDrawer    = function() { document.getElementById('drawerOverlay').classList.remove('open'); };
window.overlayClick   = function(e) { if (e.target === document.getElementById('drawerOverlay')) closeDrawer(); };

// ── Init ─────────────────────────────────────────────────
async function init() {
  await Promise.all([loadProfile(), loadItems(), loadPokemon()]);
  applyFilter();
}
init();
</script>

<!-- Navbar -->
<script>
  fetch("navbar.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("navbar-placeholder").innerHTML = html;
      if (typeof window.attachLogoutHandler === "function") window.attachLogoutHandler();
      if (typeof window.loadProfileName      === "function") window.loadProfileName();
      if (typeof window.updateWPCBalance     === "function") window.updateWPCBalance();
    });
</script>
