<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script>document.documentElement.classList.add('codex-page');</script>
<title>BIT Pokémon – The Codex</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#c9a84c; --gold-light:#f0d080;
  --parch:#f0e6cc; --parch-dark:#e4d4aa; --parch-shadow:#c8b07a;
  --ink:#1a1208; --ink2:#3a2e1a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{
  scrollbar-width:thin;
  scrollbar-color:rgba(201,168,76,.6) rgba(12,8,7,.3);
  overflow-y:auto;
}
html::-webkit-scrollbar{width:12px;}
html::-webkit-scrollbar-track{background:rgba(12,8,7,.3);}
html::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(201,168,76,.4),rgba(201,168,76,.7),rgba(201,168,76,.4));
  border-radius:6px;
  border:2px solid rgba(12,8,7,.3);
}
html::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,rgba(201,168,76,.6),rgba(201,168,76,.9),rgba(201,168,76,.6));
}

html,body{width:100%;height:auto;overflow-x:hidden;background:#0c0807;font-family:'Crimson Text',serif;}

/* ── BG ── */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 70% at 10% 50%,rgba(120,40,0,.22) 0%,transparent 65%),
    radial-gradient(ellipse 55% 70% at 90% 50%,rgba(0,30,100,.22) 0%,transparent 65%),
    radial-gradient(ellipse 80% 40% at 50% 100%,rgba(60,20,0,.35) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 10%,rgba(160,100,0,.08) 0%,transparent 60%);}

/* ── FLOATING ORB GLOWS ── */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle 300px at 8% 30%,rgba(200,140,40,.07) 0%,transparent 70%),
    radial-gradient(circle 280px at 92% 60%,rgba(40,80,180,.07) 0%,transparent 70%),
    radial-gradient(circle 200px at 50% 80%,rgba(160,80,0,.06) 0%,transparent 70%);
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{
  0%  {opacity:.6;}
  50% {opacity:1;}
  100%{opacity:.7;}
}

/* Floating ambient particles */
.bg-particle{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  animation:particleDrift linear infinite;
  opacity:0;
}
@keyframes particleDrift{
  0%  {transform:translateY(100vh) translateX(0);    opacity:0;}
  10% {opacity:.6;}
  90% {opacity:.3;}
  100%{transform:translateY(-10vh) translateX(40px); opacity:0;}
}

/* ── HEADER ── */
.hdr{flex-shrink:0;width:100%;text-align:center;padding:10px 20px 5px;position:relative;z-index:10;}
.hdr h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(15px,2.8vw,32px);letter-spacing:8px;
  background:linear-gradient(135deg,#c9a84c,#f0d080,#c9a84c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(200,160,60,.4));
  animation:titleGlow 4s ease-in-out infinite;}
@keyframes titleGlow{
  0%,100%{filter:drop-shadow(0 0 18px rgba(200,160,60,.4));}
  50%    {filter:drop-shadow(0 0 38px rgba(255,200,80,.85)) drop-shadow(0 0 70px rgba(200,140,20,.4));}
}
.hdr p{font-family:'Rajdhani',sans-serif;font-size:9px;letter-spacing:6px;color:rgba(200,180,120,.38);text-transform:uppercase;margin-top:2px;}
.hline{width:220px;height:1px;margin:4px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:lineGlow 4s ease-in-out infinite;}
@keyframes lineGlow{
  0%,100%{box-shadow:none;opacity:.7;}
  50%{box-shadow:0 0 12px rgba(200,160,60,.6),0 0 28px rgba(200,160,60,.2);opacity:1;}
}

/* ── BOOK TABS ── */
.tabs-bar{
  display:flex;align-items:center;justify-content:center;
  gap:8px;padding:5px 14px 5px;position:relative;z-index:10;
}
.tabs{
  display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;justify-content:center;align-items:center;
}
.tabs::-webkit-scrollbar{display:none;}
/* Fullscreen buttons */
.fs-btn{
  flex-shrink:0;
  font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;
  color:rgba(200,170,100,.45);padding:5px 10px;
  border:1px solid rgba(200,170,100,.18);border-radius:2px;
  cursor:pointer;transition:all .2s;background:rgba(20,12,4,.5);
  white-space:nowrap;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;
}
.fs-btn:hover{color:var(--gold-light);border-color:var(--gold);background:rgba(80,45,5,.7);}
.fs-btn svg{opacity:.7;transition:opacity .2s;}
.fs-btn:hover svg{opacity:1;}
/* Divider between tab groups and buttons */
.tabs-sep{width:1px;height:20px;background:rgba(200,160,60,.15);flex-shrink:0;}

/* ── FULLSCREEN MODES ── */
/* Reading mode: hide left panel, scroll takes full width */
#app.read-mode .left-panel{display:none;}
#app.read-mode .scroll-panel{padding:14px 40px;}

/* Presentation mode: hide everything but book area */
#app.present-mode .hdr{display:none;}
#app.present-mode .tabs-bar{display:none;}
#app.present-mode .left-panel .bookshelf{display:none;}
#app.present-mode .panel-divider{display:none;}
#app.present-mode .left-panel{width:260px;}
#app.present-mode .display-table .table-label{display:none;}
#app.present-mode .display-book{width:200px!important;height:270px!important;}
/* Exit hint */
.exit-hint{
  display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;
  color:rgba(200,160,60,.5);text-transform:uppercase;
  background:rgba(10,8,4,.85);border:1px solid rgba(200,160,60,.2);
  padding:6px 16px;border-radius:2px;z-index:100;pointer-events:none;
}
#app.read-mode .exit-hint,#app.present-mode .exit-hint{display:block;}
.tab{flex-shrink:0;font-family:'Cinzel',serif;font-size:8px;letter-spacing:2px;color:rgba(200,170,100,.4);
  padding:5px 10px;border:1px solid rgba(200,170,100,.15);border-radius:2px;cursor:pointer;
  transition:all .2s;background:rgba(20,12,4,.5);white-space:nowrap;text-transform:uppercase;}
.tab:hover{color:var(--gold-light);border-color:rgba(200,160,60,.5);}
.tab.active{color:var(--gold-light);border-color:var(--gold);background:rgba(80,45,5,.8);box-shadow:0 0 8px rgba(200,160,60,.2),0 0 20px rgba(200,160,60,.1);
  animation:tabGlow 3s ease-in-out infinite;}
@keyframes tabGlow{0%,100%{box-shadow:0 0 8px rgba(200,160,60,.2);}50%{box-shadow:0 0 14px rgba(200,160,60,.5),0 0 28px rgba(200,160,60,.15);}}

/* ── MAIN LAYOUT ── */
.layout{display:flex;flex:1 1 0;min-height:0;width:100%;overflow:hidden;}

/* ══════════════════════════════════════
   LEFT PANEL — Bookshelf + Display Table
   ══════════════════════════════════════ */
.left-panel{
  flex-shrink:0;width:380px;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0e0a04 0%,#150e06 40%,#0a0804 100%);
  border-right:1px solid rgba(200,160,60,.12);
  position:relative;overflow:hidden;
}
.left-panel::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(200,160,60,.04) 0%,transparent 50%),
    repeating-linear-gradient(180deg,transparent,transparent 60px,rgba(200,160,60,.02) 60px,rgba(200,160,60,.02) 61px);
}

/* ── BOOKSHELF ── */
.bookshelf{
  flex-shrink:0;
  padding:18px 16px 10px;
  position:relative;
}
.shelf-label{
  font-family:'Rajdhani',sans-serif;font-size:8px;letter-spacing:5px;
  color:rgba(200,160,60,.35);text-transform:uppercase;
  margin-bottom:12px;text-align:center;
}

/* Wood shelf board */
.shelf-board{
  position:relative;
  display:flex;align-items:flex-end;justify-content:center;gap:6px;
  padding:0 8px 0;
}
.shelf-board::after{
  content:'';position:absolute;bottom:-10px;left:0;right:0;height:10px;
  background:linear-gradient(180deg,#5a3a0a,#3a2206,#2a1804);
  border-radius:0 0 2px 2px;
  box-shadow:0 4px 16px rgba(0,0,0,.7),inset 0 1px 0 rgba(200,160,60,.15);
}
/* Shelf wood grain highlight */
.shelf-board::before{
  content:'';position:absolute;bottom:-10px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(200,160,60,.2),rgba(255,220,100,.3),rgba(200,160,60,.2),transparent);
  z-index:1;
}

/* Individual shelf book (spine view) */
.shelf-book{
  position:relative;
  width:36px;height:110px;
  cursor:pointer;
  transition:transform .25s cubic-bezier(.25,.8,.25,1),filter .25s;
  transform-origin:bottom center;
  border-radius:1px 2px 2px 1px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:2px 0 8px rgba(0,0,0,.6),inset 1px 0 0 rgba(255,255,255,.06);
}
.shelf-book:hover{transform:translateY(-8px) scaleX(1.05);filter:brightness(1.3);}
.shelf-book.active{transform:translateY(-10px) scaleX(1.08);filter:brightness(1.4);}
.shelf-book.active::after{
  content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px var(--gold),0 0 20px rgba(200,160,60,.6);
  animation:dotPulse 1.5s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{box-shadow:0 0 8px var(--gold),0 0 16px rgba(200,160,60,.4);}50%{box-shadow:0 0 14px var(--gold),0 0 32px rgba(200,160,60,.7);}}
/* Spine label */
.shelf-book span{
  font-family:'Cinzel',serif;font-weight:700;font-size:7px;letter-spacing:2px;
  color:rgba(200,160,60,.8);text-transform:uppercase;
  writing-mode:vertical-rl;transform:rotate(180deg);
  white-space:nowrap;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
/* Spine colours */
.sb1{background:linear-gradient(90deg,#1a0f02,#2e1a05,#1a0f02);}
.sb2{background:linear-gradient(90deg,#200202,#3a0a0a,#200202);}
.sb3{background:linear-gradient(90deg,#011a14,#02281e,#011a14);}
.sb4{background:linear-gradient(90deg,#0c0418,#1a0828,#0c0418);}
.sb5{background:linear-gradient(90deg,#030610,#06101e,#030610);}
/* Spine top decoration */
.shelf-book::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(180deg,rgba(200,160,60,.25),transparent);
  border-radius:1px 2px 0 0;
}

/* Shelf wall brackets */
.shelf-bracket{
  position:absolute;bottom:-10px;
  width:8px;height:22px;
  background:linear-gradient(90deg,#4a3008,#2a1a04);
  box-shadow:inset 1px 0 0 rgba(200,160,60,.1);
}
.shelf-bracket.left{left:4px;border-radius:0 0 0 2px;}
.shelf-bracket.right{right:4px;border-radius:0 0 2px 0;}

/* Wall texture behind shelf */
.shelf-wall{
  position:absolute;inset:0;bottom:auto;height:100%;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(0,0,0,.08) 40px,rgba(0,0,0,.08) 41px),
    repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(0,0,0,.06) 40px,rgba(0,0,0,.06) 41px);
  opacity:.5;
}

/* ── DIVIDER ── */
.panel-divider{
  flex-shrink:0;height:1px;margin:20px 16px 0;
  background:linear-gradient(90deg,transparent,rgba(200,160,60,.25),transparent);
}

/* ── DISPLAY TABLE ── */
.display-table{
  flex:1 1 0;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  padding:16px 14px 16px;
  position:relative;
}

.table-label{
  font-family:'Rajdhani',sans-serif;font-size:8px;letter-spacing:5px;
  color:rgba(200,160,60,.35);text-transform:uppercase;
  margin-bottom:14px;
}

/* The physical table surface */
.table-surface{
  width:100%;
  background:linear-gradient(145deg,#2a1a06,#1e1204,#2a1a06);
  border-radius:4px 4px 2px 2px;
  padding:14px 12px 10px;
  box-shadow:
    0 8px 24px rgba(0,0,0,.7),
    0 2px 0 rgba(200,160,60,.12),
    inset 0 1px 0 rgba(200,160,60,.08);
  border:1px solid rgba(200,160,60,.1);
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
/* Table legs */
.table-surface::after{
  content:'';position:absolute;bottom:-12px;left:10%;right:10%;height:12px;
  background:linear-gradient(90deg,#2a1604 0%,transparent 15%,transparent 85%,#2a1604 100%);
  border-bottom:2px solid #1a1004;
}

/* Book displayed on table — front cover view */
.display-book{
  width:160px;height:215px;
  position:relative;
  border-radius:1px 3px 3px 1px;
  box-shadow:
    -4px 4px 16px rgba(0,0,0,.8),
    4px 2px 10px rgba(0,0,0,.5),
    inset -3px 0 8px rgba(0,0,0,.4);
  transform:perspective(400px) rotateY(-4deg) rotateX(2deg);
  transition:transform .4s ease, box-shadow .4s ease;
  overflow:hidden;
  cursor:default;
}
.display-book:hover{
  transform:perspective(400px) rotateY(-2deg) rotateX(1deg) scale(1.04);
  box-shadow:-6px 6px 22px rgba(0,0,0,.9),4px 2px 12px rgba(0,0,0,.6),inset -3px 0 8px rgba(0,0,0,.4);
}
/* Spine strip on display book */
.display-book::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:8px;
  background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.2));
  z-index:3;
}
/* Inner border */
.display-book::after{
  content:'';position:absolute;inset:6px;
  border:1px solid rgba(200,160,60,.2);
  pointer-events:none;z-index:4;
}
.db-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 12px;text-align:center;z-index:2;overflow:hidden;
}
.db-eye{font-family:'Rajdhani',sans-serif;font-size:7px;letter-spacing:4px;color:rgba(200,160,60,.5);text-transform:uppercase;margin-bottom:10px;}
.db-title{font-family:'Cinzel',serif;font-weight:900;letter-spacing:2px;line-height:.9;font-size:16px;word-break:break-word;}
.db-div{width:44px;height:1px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.db-quote{font-family:'Crimson Text',serif;font-style:italic;font-size:8.5px;color:rgba(200,160,60,.44);line-height:1.6;}
.db-roman{font-family:'Cinzel',serif;font-weight:900;font-size:38px;color:rgba(200,160,60,.055);position:absolute;bottom:8px;right:10px;line-height:1;}

/* Selected book title under table */
.display-title{
  font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:3px;
  color:rgba(200,160,60,.5);text-transform:uppercase;text-align:center;
  margin-top:4px;
}

/* Table cloth/mat under book */
.table-mat{
  position:absolute;bottom:0;left:0;right:0;height:6px;
  background:linear-gradient(180deg,rgba(180,140,60,.05),rgba(180,140,60,.12));
  border-radius:0 0 4px 4px;
}

/* ══════════════════════════════════════
   RIGHT PANEL — Decorated Scroll
   ══════════════════════════════════════ */
.scroll-panel{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;
  padding:14px 20px 14px 14px;
  background:linear-gradient(180deg,#080604 0%,#0c0906 100%);
  position:relative;
}

/* Outer frame — like a picture frame around the scroll */
.scroll-frame{
  flex:1 1 0;min-height:0;
  position:relative;
  border:1px solid rgba(200,160,60,.2);
  border-radius:3px;
  box-shadow:
    0 0 0 4px rgba(10,8,4,.8),
    0 0 0 5px rgba(200,160,60,.1),
    0 0 40px rgba(0,0,0,.6),
    inset 0 0 80px rgba(0,0,0,.2);
}
/* Frame corner ornaments */
.scroll-frame::before,.scroll-frame::after{
  font-family:'serif';font-size:14px;color:rgba(200,160,60,.4);
  position:absolute;z-index:10;pointer-events:none;line-height:1;
}
.scroll-frame::before{content:'❧';top:6px;left:8px;}
.scroll-frame::after{content:'❧';bottom:6px;right:8px;transform:rotate(180deg);}

/* Corner pieces (CSS) */
.frame-corner{position:absolute;width:20px;height:20px;z-index:10;pointer-events:none;}
.frame-corner.tl{top:-1px;left:-1px;border-top:2px solid rgba(200,160,60,.55);border-left:2px solid rgba(200,160,60,.55);}
.frame-corner.tr{top:-1px;right:-1px;border-top:2px solid rgba(200,160,60,.55);border-right:2px solid rgba(200,160,60,.55);}
.frame-corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid rgba(200,160,60,.55);border-left:2px solid rgba(200,160,60,.55);}
.frame-corner.br{bottom:-1px;right:-1px;border-bottom:2px solid rgba(200,160,60,.55);border-right:2px solid rgba(200,160,60,.55);}
.frame-corner{animation:cornerPulse 4s ease-in-out infinite;}
@keyframes cornerPulse{0%,100%{opacity:.55;}50%{opacity:1;filter:drop-shadow(0 0 4px rgba(200,160,60,.6));}}

/* Top + bottom scroll rollers */
.scroll-roller{
  position:absolute;left:-2px;right:-2px;height:24px;z-index:6;
  background:linear-gradient(180deg,#4a3410,#7a5a1e,#9a7030,#7a5a1e,#4a3410);
  box-shadow:0 4px 14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,220,100,.25),inset 0 -1px 0 rgba(0,0,0,.4),0 0 18px rgba(200,140,40,.12);
  animation:rollerGlow 5s ease-in-out infinite;
}
@keyframes rollerGlow{
  0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,220,100,.25),0 0 12px rgba(200,140,40,.08);}
  50%    {box-shadow:0 4px 14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,220,100,.4), 0 0 28px rgba(200,140,40,.28);}
}
.scroll-roller.top{top:-2px;border-radius:3px 3px 0 0;}
.scroll-roller.bot{bottom:-2px;border-radius:0 0 3px 3px;}
/* Roller ring engravings */
.scroll-roller::before{
  content:'';position:absolute;top:50%;left:12px;right:12px;height:3px;transform:translateY(-50%);
  background:linear-gradient(90deg,transparent,rgba(200,160,60,.4),rgba(255,230,120,.6),rgba(200,160,60,.4),transparent);
  border-radius:2px;
}
.scroll-roller::after{
  content:'';position:absolute;top:4px;bottom:4px;left:0;right:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.3) 0%,transparent 8%,transparent 92%,rgba(0,0,0,.3) 100%);
}
/* Roller end caps */
.roller-cap{
  position:absolute;top:0;bottom:0;width:12px;
  background:linear-gradient(90deg,#2a1808,#5a3a12);
  z-index:7;
}
.roller-cap.l{left:-2px;border-radius:3px 0 0 3px;box-shadow:inset 2px 0 4px rgba(0,0,0,.5);}
.roller-cap.r{right:-2px;border-radius:0 3px 3px 0;box-shadow:inset -2px 0 4px rgba(0,0,0,.5);}

/* Parchment scroll area */
.scroll-inner{
  position:absolute;top:22px;bottom:22px;left:0;right:0;
  overflow-y:auto;
  background:
    linear-gradient(180deg,rgba(30,18,4,.25) 0%,transparent 5%,transparent 95%,rgba(30,18,4,.25) 100%),
    linear-gradient(135deg,#f5ecd4 0%,#f0e3c0 25%,#f8efd8 50%,#ead8b0 75%,#f2e5c8 100%);
  scrollbar-width:thin;
  scrollbar-color:rgba(180,140,60,.35) transparent;
}
.scroll-inner::-webkit-scrollbar{width:6px;}
.scroll-inner::-webkit-scrollbar-track{background:transparent;}
.scroll-inner::-webkit-scrollbar-thumb{background:rgba(180,140,60,.3);border-radius:3px;}

/* Fade top/bottom of parchment */
.scroll-fade{
  position:absolute;left:0;right:0;height:36px;z-index:4;pointer-events:none;
}
.scroll-fade.top{top:22px;background:linear-gradient(180deg,rgba(240,220,160,.4),transparent);}
.scroll-fade.bot{bottom:22px;background:linear-gradient(0deg,rgba(240,220,160,.4),transparent);}

/* ── SCROLL CONTENT TYPOGRAPHY ── */
.scroll-content{
  padding:32px 52px 44px;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(100,60,10,.022) 27px,rgba(100,60,10,.022) 28px);
  min-height:100%;
}
.s-bookhead{font-family:'Cinzel',serif;font-size:9px;letter-spacing:5px;color:rgba(100,70,20,.42);text-transform:uppercase;margin-bottom:22px;padding-bottom:8px;border-bottom:1px solid rgba(180,140,60,.22);}
.s-chapter-block{text-align:center;padding:28px 16px 24px;margin-bottom:26px;border-top:1px solid rgba(180,140,60,.18);border-bottom:1px solid rgba(180,140,60,.18);background:rgba(180,140,60,.035);}
.s-ch-num{font-family:'Cinzel',serif;font-weight:900;font-size:68px;color:rgba(100,70,20,.05);line-height:1;margin-bottom:-8px;}
.s-ch-label{font-family:'Rajdhani',sans-serif;font-size:9px;letter-spacing:6px;color:rgba(100,70,20,.38);text-transform:uppercase;}
.s-ch-title{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(15px,2vw,20px);color:var(--ink);letter-spacing:2px;line-height:1.3;margin:8px 0;}
.s-ch-orn{color:var(--gold);font-size:13px;opacity:.55;margin:5px 0;}
.s-ch-intro{font-family:'Crimson Text',serif;font-style:italic;font-size:13px;color:rgba(50,35,10,.52);max-width:400px;margin:0 auto;line-height:1.65;}
.s-section{font-family:'Cinzel',serif;font-weight:700;font-size:9.5px;letter-spacing:3px;color:var(--ink);text-transform:uppercase;margin:20px 0 7px;padding-bottom:3px;border-bottom:1px solid rgba(180,140,60,.22);}
.s-p{font-family:'Crimson Text',serif;font-size:15px;line-height:1.78;color:var(--ink2);text-align:justify;hyphens:auto;margin-bottom:13px;}
.s-p:last-child{margin-bottom:0;}
.s-drop::first-letter{font-family:'Cinzel',serif;font-weight:900;font-size:50px;line-height:.8;float:left;margin:4px 8px 0 0;color:var(--ink);}
.s-quote{border-left:3px solid rgba(180,140,60,.38);padding:9px 16px;margin:16px 0;font-style:italic;color:rgba(50,35,10,.62);font-size:14px;background:rgba(180,140,60,.055);line-height:1.65;border-radius:0 3px 3px 0;}
.s-divider{width:100px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,rgba(180,140,60,.38),transparent);}
.s-ornament{text-align:center;color:var(--gold);font-size:11px;opacity:.45;margin:16px 0;letter-spacing:6px;}
.s-poke{display:flex;flex-direction:column;align-items:center;margin:18px 0 8px;gap:3px;}
.s-poke img{image-rendering:auto;opacity:0;transition:opacity .5s;filter:drop-shadow(0 4px 14px rgba(0,0,0,.22));}
.s-poke img.vis{opacity:1;}
.s-poke-cap{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.48);text-transform:uppercase;}
.s-poke-sub{font-family:'Crimson Text',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.4);}
.s-faction{margin:18px 0 8px;padding:14px 16px;border:1px solid rgba(180,140,60,.16);background:rgba(180,140,60,.035);border-radius:3px;}
.s-faction-flag{display:flex;justify-content:center;margin-bottom:8px;}
.s-faction-name{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:3px;text-align:center;margin-bottom:2px;}
.s-faction-motto{font-family:'Crimson Text',serif;font-style:italic;font-size:12.5px;text-align:center;opacity:.62;margin-bottom:8px;}
.s-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.s-chip{background:rgba(0,0,0,.065);border:1px solid rgba(0,0,0,.11);border-radius:2px;padding:2px 7px;font-family:'Rajdhani',sans-serif;font-size:9.5px;letter-spacing:1px;color:rgba(30,20,5,.58);}

/* Whole app */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;z-index:1;}
.faction-svg{display:block;}

<script>
var ART = function(id){ return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + id + '.png'; };
var getFlag = function(id){ var el=document.getElementById(id); return el ? el.innerHTML : ''; };

function pkHtml(id, sz) {
  sz = sz||160;
  return '<div class="s-poke"><img src="'+ART(id)+'" width="'+sz+'" height="'+sz+'" style="object-fit:contain" onload="this.classList.add(\'vis\')" onerror="this.style.display=\'none\'"></div>';
}

function ch(num, title, intro) {
  return '<div class="s-chapter-block">'+
    '<div class="s-ch-num">'+num+'</div>'+
    '<div class="s-ch-label">Chapter '+num+'</div>'+
    '<div class="s-ch-title">'+title+'</div>'+
    '<div class="s-ch-orn">&mdash; &#10022; &mdash;</div>'+
    '<div class="s-ch-intro">'+intro+'</div>'+
  '</div>';
}

function faction(flagId, nameColor, name, mottoColor, motto, body, chips) {
  var c = chips.map(function(x){ return '<div class="s-chip">'+x+'</div>'; }).join('');
  return '<div class="s-faction">'+
    '<div class="s-faction-flag">'+getFlag(flagId)+'</div>'+
    '<div class="s-faction-name" style="color:'+nameColor+'">'+name+'</div>'+
    '<div class="s-faction-motto" style="color:'+mottoColor+'">'+motto+'</div>'+
    '<div class="s-p">'+body+'</div>'+
    '<div class="s-chips">'+c+'</div>'+
  '</div>';
}

// ── BOOK CONTENT ──
// Each book is one big scroll of HTML
var BOOK_COVERS = [
  { bk:'bk1', grad:'g1', vol:'I',  title:'THE AGE<br>BEFORE',       quote:'"They walked beside us once.<br>We did not deserve them."',             roman:'I',   spine:'The Age Before',    label:'Book I &mdash; The Age Before',    roman_txt:'I'   },
  { bk:'bk2', grad:'g2', vol:'II', title:'THE<br>WARDEN\'S CURSE',   quote:'"It did not destroy us.<br>It simply stopped protecting us."',           roman:'II',  spine:"The Warden's Curse", label:"Book II &mdash; The Warden's Curse", roman_txt:'II'  },
  { bk:'bk3', grad:'g3', vol:'III',title:'THE FIRST<br>ORDER',       quote:'"They fought the wrong war<br>for all the right reasons."',              roman:'III', spine:'The First Order',    label:'Book III &mdash; The First Order',  roman_txt:'III' },
  { bk:'bk4', grad:'g4', vol:'IV', title:'THE<br>FACTIONS',          quote:'"Three flags. Three lies.<br>One wasteland."',                            roman:'IV',  spine:'The Factions',       label:'Book IV &mdash; The Factions',      roman_txt:'IV'  },
  { bk:'bk5', grad:'g5', vol:'V',  title:'THE<br>LAST GUARD',        quote:'"Twelve went into the ravine.<br>One came back. That one was you."',      roman:'V',   spine:'The Last Guard',     label:'Book V &mdash; The Last Guard',     roman_txt:'V'   },
];

var BOOKS = {
1:
  '<div class="s-bookhead">Book I &mdash; The Age Before</div>'+

  '<div class="s-section">A Note to the Reader</div>'+
  '<p class="s-p s-drop">What follows is not history. History requires distance. What follows is memory &mdash; the kind that survives in old songs, in the names children are still given without knowing why, in the instinctive discomfort a person feels when they walk through a forest that is too quiet.</p>'+
  '<p class="s-p">The world that existed before the Warden\'s Curse is not recoverable. The records were lost. The cities were razed. The people who remembered it firsthand are five centuries dead. What remains are fragments &mdash; not the crystal kind &mdash; the human kind. Stories passed mouth to mouth until the original words wore away and only the shape of the feeling remained.</p>'+
  '<div class="s-quote">&ldquo;They were not gods. They were not pets. They were not weapons. They were neighbours. And we drove them out of their own world.&rdquo; &mdash; recovered oral history, settlement unknown</div>'+
  '<p class="s-p">This is Book One. The age before everything went wrong. Read it not as a record but as a reckoning.</p>'+

  '<div class="s-divider"></div>'+

  ch('I','A World Shared','"Before the silence, there was a sound unlike anything the world has known since &mdash; ten thousand different calls rising from ten thousand different creatures, in a world that was, for all its violence, genuinely alive."')+

  '<p class="s-p s-drop">Pok&eacute;mon did not always live in containment devices. That is a fact the old world\'s historians recorded with embarrassment, as if acknowledging it implicated them in something. It did. In the earliest centuries of recorded human-Pok&eacute;mon coexistence, the two species occupied the same spaces as genuine equals &mdash; competing for territory, occasionally fighting, occasionally cooperating, always watching each other across a boundary of mutual uncertainty.</p>'+
  '<p class="s-p">The Pok&eacute;ball changed the relationship permanently. A compact sphere that reduced a living creature to stored energy &mdash; compact, portable, infinitely convenient. The trainer tradition that emerged around it was sincere. The bond it enabled was real. But beneath that bond was something that would never be fully acknowledged until it was too late: the Pok&eacute;ball was a device of control. And the Pok&eacute;mon inside it were, by definition, contained.</p>'+
  '<div class="s-quote">&ldquo;A Pok&eacute;mon that has bonded with a trainer is not a pet, not a weapon, not a tool. It is a partner. We told ourselves this often enough that we forgot to ask whether the Pok&eacute;mon had been given a choice.&rdquo;</div>'+

  pkHtml(6, 180)+
  '<div class="s-poke-cap" style="text-align:center;font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.5);text-transform:uppercase">Charizard &middot; No. 006</div>'+
  '<div class="s-poke-sub" style="text-align:center;font-family:\'Crimson Text\',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.42);margin-bottom:12px">&ldquo;The apex of an unbroken bond between trainer and flame. Or so they believed.&rdquo;</div>'+

  '<div class="s-section">The Collapse of Restraint</div>'+
  '<p class="s-p s-drop">The old world had laws. Pok&eacute;mon protection statutes. Habitat preservation requirements. Breeding regulations. They existed on paper. They were systematically ignored in practice. The industrial era brought with it an appetite for Pok&eacute;mon labour, Pok&eacute;mon energy, Pok&eacute;mon combat, Pok&eacute;mon spectacle, that no legislation could fully contain.</p>'+
  '<p class="s-p">By the century before the Curse, the wild Pok&eacute;mon population had declined to a fraction of its historical numbers. Dragon-type species had retreated to locations so remote that most trainers had never seen one in the wild. Legendary Pok&eacute;mon &mdash; the great singular creatures whose existence predated human civilisation &mdash; had not been reliably documented in decades.</p>'+
  '<p class="s-p">Most humans interpreted this as progress. The frontier was being settled. The wild was being tamed. What they failed to understand &mdash; what they would not understand until it was catastrophically too late &mdash; was that certain Pok&eacute;mon were not merely animals. They were something older. Something that had, for reasons no researcher ever fully explained, taken an interest in whether the world deserved to continue.</p>'+
  '<div class="s-quote">&ldquo;I choose you.&rdquo; Three words. The most important three words in a world that no longer exists. We said them to them. We never thought to ask what they chose.&rdquo;</div>',

2:
  '<div class="s-bookhead">Book II &mdash; The Warden\'s Curse</div>'+

  '<div class="s-section">On the Nature of What Happened</div>'+
  '<p class="s-p s-drop">No one knows which Pok&eacute;mon did it. This is the detail that historians, theologians, and faction ideologues have argued over for five hundred years. The Hollow calls it Giratina. Ironclad\'s official position is that the Curse was a natural phenomenon, not a conscious act &mdash; an admission, some say, of how little they understand about what they are fighting with. The Echo Syndicate has seventeen competing theories and considers all of them plausible.</p>'+
  '<p class="s-p">What is not disputed is what happened. On a day that has no agreed-upon name, across every region simultaneously, Pok&eacute;balls failed. Not degraded. Not malfunctioned. Failed &mdash; completely, permanently, and without any technical explanation that satisfied the engineers who examined them. The spheres still opened. The energy transfer mechanism still functioned. But Pok&eacute;mon released from them did not return. They simply&hellip; left.</p>'+
  '<div class="s-quote">&ldquo;The device works. The ball opens. The light goes out. And where a Charizard should be standing, there is nothing. Just ash and a smell like ozone and the sound of your Pok&eacute;mon not coming back.&rdquo; &mdash; Trainer field report, Day One, exact location lost</div>'+

  '<div class="s-divider"></div>'+

  ch('II','The Day the Bond Broke','"Every trainer in recorded history remembered where they were when it happened. Not because they kept journals. Because some things brand themselves into you."')+

  '<p class="s-p s-drop">The Pok&eacute;mon did not attack immediately. That is the detail that haunts the old records most. For the first three days, they simply&hellip; wandered. Trainers reported finding their bonded Pok&eacute;mon sitting in fields, standing in rivers, perched on rooftops &mdash; alive, uninjured, but wholly indifferent to any command, any call, any bond that had previously existed. The eyes that had once looked at their trainers with recognition now looked through them as if they were not there.</p>'+
  '<p class="s-p">On the fourth day, the first attacks began. Not random &mdash; targeted. Systematically and precisely targeted at human infrastructure. Power stations. Water treatment facilities. Agricultural complexes that depended on Pok&eacute;mon labour. Whoever &mdash; or whatever &mdash; had broken the bond had also, apparently, given the Pok&eacute;mon a direction.</p>'+

  pkHtml(150, 180)+
  '<div class="s-poke-cap" style="text-align:center;font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.5);text-transform:uppercase">Mewtwo &middot; No. 150</div>'+
  '<div class="s-poke-sub" style="text-align:center;font-family:\'Crimson Text\',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.42);margin-bottom:12px">&ldquo;The most powerful Pok&eacute;mon ever recorded. It did not choose sides. It simply waited.&rdquo;</div>'+

  '<div class="s-section">The Warden Theory</div>'+
  '<p class="s-p">The dominant scholarly framework &mdash; contested by Ironclad, accepted by the Echo Syndicate, considered irrelevant by the Hollow &mdash; is the Warden Theory. It holds that certain Legendary Pok&eacute;mon had always functioned as a kind of silent governance over the natural world: monitoring, balancing, correcting. Not gods. Not rulers. Wardens. Custodians of an equilibrium that most humans had never known existed because it was maintained so quietly.</p>'+
  '<p class="s-p">The theory holds that the Curse was not an act of malice but of judgment. That the Warden &mdash; whichever Pok&eacute;mon it was &mdash; had reached a threshold. That it had watched the human relationship with Pok&eacute;mon reach a point of exploitation so complete, so unconscious, so total, that intervention became necessary. Not to destroy humanity. To withdraw consent. To remove the cooperation that humans had mistaken for submission and show them what the world looked like without it.</p>'+
  '<div class="s-quote">&ldquo;It did not destroy us. It simply stopped protecting us. The difference, as it turned out, was everything.&rdquo; &mdash; Echo Syndicate Archive, Document 0044-F</div>'+

  '<div class="s-divider"></div>'+

  ch('III','The Years of Fire','"The Pok&eacute;mon did not hate us. That was the worst part. Hatred implies we mattered enough to hate. They were simply&hellip; correcting an imbalance."')+

  '<p class="s-p s-drop">The years immediately following the Curse were not a war. Wars have two sides. What followed the Curse was a rout. Human settlements that had been built around Pok&eacute;mon labour &mdash; which was to say, virtually all of them &mdash; collapsed within months. The infrastructure that remained was targeted with a precision that suggested either coordination or intelligence that no one wanted to formally acknowledge.</p>'+
  '<p class="s-p">The Legendary Pok&eacute;mon, when they appeared, were not seen to fight. They moved through the destruction the way a storm moves through a forest &mdash; not angry, not triumphant, simply inevitable. Dragon-type Pok&eacute;mon that had not been sighted in decades emerged from their retreats and were observed flying reconnaissance patterns over human population centres. The purpose was unclear. The effect on morale was absolute.</p>'+
  '<p class="s-p">Human population fell by an estimated forty percent in the first decade. The records become unreliable after that &mdash; the people keeping them had other priorities.</p>',

3:
  '<div class="s-bookhead">Book III &mdash; The First Order</div>'+

  '<div class="s-section">The Refusal</div>'+
  '<p class="s-p s-drop">Every catastrophe produces, eventually, someone who refuses to accept it. In the years immediately following the Curse, that person was Professor Daelan Voss. He was not the most decorated scientist of the old world. He was not the most celebrated. He was, by most accounts, impossible &mdash; combative, obsessive, contemptuous of consensus, and absolutely certain that the correct response to the Warden\'s Curse was not surrender.</p>'+
  '<div class="s-quote">&ldquo;The Pok&eacute;mon are not our enemies. The entity that broke the bond &mdash; whatever it is &mdash; is our enemy. Everything else is a symptom. I intend to treat the disease.&rdquo; &mdash; Professor Daelan Voss, personal record, Year 3 Post-Curse</div>'+
  '<p class="s-p">Voss\'s insight was singular and, in retrospect, obvious: the Pok&eacute;ball had failed because it was a device of containment. It worked only with the cooperation of the Pok&eacute;mon inside it. Remove that cooperation, and the ball was just a sphere. The solution was not to repair the ball. The solution was to stop relying on cooperation entirely.</p>'+

  '<div class="s-divider"></div>'+

  ch('IV','The Particle Interface Projector','"A beam fires. It finds the target. It reads the target. It makes a copy of the target. The copy is loyal. The original is no longer your problem."')+

  '<p class="s-p s-drop">The PIP &mdash; Particle Interface Projector &mdash; was not built to be humane. Voss, to his credit, never claimed otherwise. The device worked by capturing a Pok&eacute;mon\'s complete bioelectric signature &mdash; every frequency, every pattern, every recursive loop that constituted a specific Pok&eacute;mon\'s identity &mdash; and encoding it into a crystalline substrate he called a Fragment chip. The chip could then be loaded into the PIP\'s reader slot and the Pok&eacute;mon reconstituted at will, beam fired at the ground, mass coalescing in seconds.</p>'+
  '<p class="s-p">The critical innovation &mdash; and the one that made the technology militarily decisive &mdash; was the loyalty architecture. Pok&eacute;mon reconstituted from a Fragment chip emerged bonded, not to the species that had broken them, but to the specific individual whose PIP had reconstituted them. The Warden\'s Curse had broken the old bond. Voss had simply built a new one. A harder one. One that did not require consent.</p>'+

  pkHtml(25, 170)+
  '<div class="s-poke-cap" style="text-align:center;font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.5);text-transform:uppercase">Pikachu &middot; No. 025</div>'+
  '<div class="s-poke-sub" style="text-align:center;font-family:\'Crimson Text\',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.42);margin-bottom:12px">&ldquo;The first successful Fragment summoning. The electricity shorted out Voss\'s entire laboratory. He considered it a success.&rdquo;</div>'+

  '<div class="s-section">The First Order and the Cloning Doctrine</div>'+
  '<p class="s-p s-drop">The military force that coalesced around Voss\'s technology called itself the First Order &mdash; a name chosen deliberately, intended to convey that they were not a government, not a nation, but a principle. Order, first. Everything else second. Their initial strategy was straightforward and brutal: focus all capture operations on Fighting-type Pok&eacute;mon. Reconstitute them in volume. Deploy them against the feral population.</p>'+
  '<p class="s-p">Fragment capture worked on a one-to-one basis. One beam, one signature, one chip. To produce ten Machamp soldiers, you needed to capture and encode ten Machamp. The First Order\'s solution was industrial scale. Capture operations ran continuously. Fragment chips were mass-produced. At the height of the campaign, First Order field units were reconstituting hundreds of Pok&eacute;mon per day across dozens of active fronts.</p>'+
  '<div class="s-quote">&ldquo;We are not trainers. Trainers asked permission. We are soldiers, and we are taking back what was taken from us.&rdquo; &mdash; First Order Field Commander, Year 14 Post-Curse</div>'+

  '<div class="s-section">The Campaign and Its Limits</div>'+
  '<p class="s-p">For forty years, the First Order fought. They were disciplined, organised, and increasingly effective. By Year 40, Fragment signatures had been captured for almost every known Pok&eacute;mon species. The great catalogue that Voss had envisioned &mdash; every species encoded, every DNA signature preserved &mdash; was within reach.</p>'+
  '<p class="s-p">What remained uncaptured were three categories. Dragon-type Pok&eacute;mon, whose bioelectric signatures proved resistant to standard encoding and required specialised equipment that was still in development. Ultra-class Legendaries, which had not been directly sighted since the earliest years of the Curse and were believed to be operating at ranges far beyond First Order patrol zones. And the Warden itself &mdash; whatever entity had initiated the Curse &mdash; which had not been seen at all.</p>'+
  '<div class="s-quote">&ldquo;We won every battle. We were winning the war. I have spent forty years trying to understand how that was possible and still not be enough.&rdquo; &mdash; First Order Commander-General Hadris, final journal entry</div>'+

  '<div class="s-divider"></div>'+

  ch('V','The Fall of Straive','"They came out of the places we had stopped looking. They always do."')+

  '<p class="s-p s-drop">Straive was not the largest city in the First Order\'s territory. It was not the most strategically significant in conventional terms. It was significant for one reason: it was where Voss had built his laboratory. Where the PIP had been invented. Where the Fragment programme had begun. For the First Order, Straive was not just a city. It was a symbol. The proof that humanity could fight back.</p>'+
  '<p class="s-p">In Year 47 Post-Curse, the Dragon-type Pok&eacute;mon that had been absent from the conflict for decades emerged simultaneously across seventeen separate fronts. They had not been resting. They had been waiting &mdash; coordinating, preparing, learning the patterns of First Order operations with a patience that no military planner had thought to account for. The counter-offensive was not chaotic. It was precise. First Order supply lines were cut first. Communication infrastructure second. Reinforcement routes third.</p>'+
  '<p class="s-p">Straive fell in eleven days. The laboratory was destroyed. The central command was gone. Voss himself died in the evacuation &mdash; some accounts say he refused to leave his research, that he was still encoding signatures when the walls came down. No one who was in the laboratory that day survived to clarify.</p>'+
  '<p class="s-p">The First Order did not surrender. It fragmented. Soldiers who had given decades to the campaign looked at the ruins of their command structure and made different choices. Some kept fighting, localised and increasingly desperate. Some laid down their arms. Three groups, in three different cities that had survived the assault, raised new flags over new ideologies. And the long age of the Wasteland began.</p>'+

  pkHtml(149, 160)+
  '<div class="s-poke-cap" style="text-align:center;font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.5);text-transform:uppercase">Dragonite &middot; No. 149</div>'+
  '<div class="s-poke-sub" style="text-align:center;font-family:\'Crimson Text\',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.42);margin-bottom:12px">&ldquo;The vanguard of the counter-offensive. Its silhouette over Straive was the last thing many soldiers saw.&rdquo;</div>',

4:
  '<div class="s-bookhead">Book IV &mdash; The Factions</div>'+

  '<div class="s-section">Five Hundred Years</div>'+
  '<p class="s-p s-drop">Five centuries is a long time. Long enough for the First Order to pass from history into mythology. Long enough for the Wasteland to develop its own culture, its own laws, its own language of survival. Long enough for the human population &mdash; devastated by the Curse, further depleted by the Campaign and its collapse &mdash; to recover to something approaching stability. Not prosperity. Not safety. Stability, which in the Wasteland means something specific: the knowledge of which threats are predictable and which are not.</p>'+
  '<p class="s-p">The Pok&eacute;mon did not leave. That is the central fact of the Wasteland that newcomers always misunderstand. They are here. They have always been here. They live in the ruins, in the dead zones, in the territories between settlements. Some are passive. Some are territorial. Some are something older and stranger that does not map neatly onto either category. They will attack humans on sight in most uninhabited areas. This is simply the condition of the world.</p>'+
  '<div class="s-quote">&ldquo;There are no neutral parties in a world where the most powerful weapons wear the faces of creatures your grandparents called companions.&rdquo; &mdash; Wasteland saying, origin unknown</div>'+
  '<p class="s-p">The Fragment chips scattered by the First Order\'s collapse are still out there. In ruins. In vaults. In the hands of scavengers who do not know what they have, and in the hands of people who know exactly what they have and intend to keep it. Three factions have built entire civilisations on the power those chips represent. Each believes it is right. Each has evidence for that belief. This is what makes them dangerous.</p>'+

  '<div class="s-divider"></div>'+

  faction('flag-ironclad','#6b1a1a','IRONCLAD','#8b3030','&ldquo;Order through dominance.&rdquo;',
    'Ironclad emerged from the largest surviving battalion of the First Order &mdash; soldiers who refused to stop fighting after Straive fell, who simply redirected their campaign from defeating the Pok&eacute;mon to controlling the humans. They are the largest and most militarised faction in the Wasteland. Their ideology is the ideology of the First Order, stripped of its science and reduced to its operational core: if you hold the strongest Fragments, you hold power. Everything else is philosophy. Ironclad has no interest in philosophy.',
    ['Machamp','Golem','Rhydon','Snorlax','Tyranitar'])+

  pkHtml(68, 160)+
  '<div class="s-poke-cap" style="text-align:center;font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.5);text-transform:uppercase">Machamp &middot; Ironclad Frontliner</div>'+
  '<div class="s-poke-sub" style="text-align:center;font-family:\'Crimson Text\',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.42);margin-bottom:12px">&ldquo;Four arms. Zero hesitation. No questions asked and none welcomed.&rdquo;</div>'+
  '<div class="s-quote">&ldquo;The alternative to us is not freedom. The alternative to us is Straive. We have seen Straive. We chose this.&rdquo; &mdash; Ironclad Commander\'s Oath</div>'+

  '<div class="s-divider"></div>'+

  faction('flag-echo','#1a3a8b','THE ECHO SYNDICATE','#2a5abb','&ldquo;Knowledge is the only currency that cannot be seized.&rdquo;',
    'If Ironclad is the inheritance of the First Order\'s military, the Echo Syndicate is the inheritance of its science. Founded by researchers who escaped Straive with Voss\'s incomplete notes and the conviction that his work was not finished, the Syndicate\'s obsession is not power but understanding. They believe that embedded in the Fragment substrate itself &mdash; not in any individual chip, but in the mathematical structure of the medium &mdash; Voss left a message. They call what they are searching for Project Genesis: a method not for controlling Pok&eacute;mon, but for undoing the Warden\'s Curse entirely. For making the old world real again.',
    ['Alakazam','Mewtwo','Starmie','Gengar','Espeon'])+

  '<div class="s-quote">&ldquo;Voss didn\'t just want to preserve Pok&eacute;mon. He wanted to give them back to a world that had finally learned to deserve them. We are not there yet. We are trying.&rdquo; &mdash; Echo Syndicate, Internal Report 0089-G</div>'+

  '<div class="s-divider"></div>'+

  faction('flag-hollow','#6622bb','THE HOLLOW','#9933ff','&ldquo;They belonged to the world. The world should burn for what it did to them.&rdquo;',
    'The Hollow does not have a military. It does not have a government. It does not, technically, have a membership. What it has is a belief: that the Warden\'s Curse was just. That the First Order was a crime. That Fragment technology &mdash; the loyalty architecture, the forced bonding, the industrial reconstitution of beings that had chosen to be free &mdash; is the continuation of the original sin that caused the Curse. The Hollow has discovered a method of corrupting Fragment chips, stripping the loyalty architecture and releasing what they call true Pok&eacute;mon &mdash; feral, unbonded, obedient to nothing. They deploy these in populated areas. They call it justice. Everyone else calls it terrorism.',
    ['Gengar','Haunter','Gyarados','Dragonite','Charizard &#10007;'])+

  '<div class="s-quote">&ldquo;We are not the monsters. We are the consequence. If you want to end us, stop doing the thing that creates us.&rdquo; &mdash; The Hollow, recovered manifesto, no author attributed</div>',

5:
  '<div class="s-bookhead">Book V &mdash; The Last Guard</div>'+

  '<div class="s-section">The Outskirts</div>'+
  '<p class="s-p s-drop">The three factions do not care about the small villages. This is not generosity &mdash; it is arithmetic. The villages are too scattered, too poor, too lightly Fragmented to be worth the administrative cost of incorporation. They exist in the gaps between faction territory, surviving through obscurity, through careful non-alignment, through the simple fact that there is nothing in them worth taking.</p>'+
  '<p class="s-p">You grew up in one of these villages. Boundary post, technically. Guard rotation, two shifts, nothing ever happened. The Pok&eacute;mon that wandered too close to the perimeter were small. You had a Fragment chip that had been in your family for two generations, encoded with something no one had been able to identify because the signal degraded before it could be fully read. You kept it anyway. It was warm to the touch in a way that no crystal should be warm.</p>'+
  '<div class="s-quote">&ldquo;A Fragment Hunter who survives their first year is either very skilled, very lucky, or very careful about which jobs they take. Usually all three.&rdquo; &mdash; Wasteland saying</div>'+

  '<div class="s-divider"></div>'+

  ch('VI','The Day the Legend Found You','"It did not look for your village. Your village was simply in the direction it was moving. The distinction, to eleven of the twelve people who came after it, did not matter."')+

  '<p class="s-p s-drop">No one in the village had ever seen a Legendary Pok&eacute;mon. The oldest records described them as myths &mdash; things the First Order had failed to capture, things the factions claimed to be searching for, things that most Wasteland residents had quietly concluded were simply gone. You had grown up treating the stories as allegory.</p>'+
  '<p class="s-p">The attack was not an attack in any conventional sense. The Legendary did not appear to notice the village. It was moving &mdash; migrating, perhaps, or pursuing something, or simply following a route laid down before the settlement existed. The destruction was incidental. A wing swept through a building the way wind sweeps through tall grass. It is not malice. It is scale.</p>'+
  '<p class="s-p">Twelve of you survived the initial impact. Twelve was enough. Twelve was a hunting party. Twelve was enough to convince each other that what you were doing was not suicidal.</p>'+
  '<p class="s-p">You were not trying to kill it. You were trying to clip it &mdash; wound it enough to ground it, capture its Fragment signature, and sell the chip to whoever would pay the most. A Legendary-class Fragment on the black market would buy your village three generations of protection. That was the plan. Plans are useful until they encounter the thing they were made to address.</p>'+

  pkHtml(384, 180)+
  '<div class="s-poke-cap" style="text-align:center;font-family:\'Cinzel\',serif;font-size:9px;letter-spacing:4px;color:rgba(100,70,20,.5);text-transform:uppercase">Rayquaza &middot; The Sky Warden</div>'+
  '<div class="s-poke-sub" style="text-align:center;font-family:\'Crimson Text\',serif;font-style:italic;font-size:12px;color:rgba(80,55,15,.42);margin-bottom:12px">&ldquo;Last confirmed sighting before the raid on your village: unknown. Last confirmed sighting after: you are the only witness still alive.&rdquo;</div>'+

  '<div class="s-section">The Ravine</div>'+
  '<p class="s-p s-drop">You clipped it. One of your twelve managed to clip it &mdash; a modified signal disruptor, salvaged First Order tech, something that was never supposed to work against a target that size. It worked well enough. The Legendary fell toward the ravine &mdash; a circular depression in the dead land, the kind the Wasteland makes a lot of, geology expressing its grief. You and your twelve went in after it.</p>'+
  '<p class="s-p">You were the one who chose your character from the twelve. That choice was made before the ravine. After the ravine, the choice was made for you, by something that does not negotiate and does not explain itself.</p>'+
  '<p class="s-p">Eleven of your twelve did not come back out. The details of that are yours to carry. This record will not catalogue them. What matters is what you found when the noise stopped and the dust settled and you understood that you were the only one still breathing.</p>'+
  '<p class="s-p">In the rubble, half-buried, exactly where your group had left it when they came in: the chest. And inside the chest, where it had always been, the old PIP device that one of your number had dragged along as an afterthought &mdash; just in case, they had said. Just in case.</p>'+

  '<div class="s-section">The Moment the Journey Begins</div>'+
  '<p class="s-p s-drop">The reader slot already has a chip in it. You do not know whose it is. You do not know what it contains. You do not know if the device still works after however long it spent in that chest in that rubble. It is warm to the touch in a way that no crystal should be warm.</p>'+
  '<p class="s-p">You are injured. You are alone. The Legendary is somewhere in the ravine and you do not know if it is dead or simply resting. The factions will send scouts when the seismic readings filter through their monitoring systems &mdash; a Legendary going down generates a signature that can be read from three hundred kilometres. You have perhaps six hours before the first of them arrives.</p>'+
  '<p class="s-p">You strap the PIP to your wrist. You activate the beam. The chip reads. The Pok&eacute;mon forms &mdash; real mass, real power, real presence &mdash; and it opens its eyes and it looks at you with that specific and terrifying question that every Pok&eacute;mon has asked every human since the beginning of the bond.</p>'+
  '<p class="s-p"><em>Are you worth it?</em></p>'+
  '<p class="s-p">That is where your story starts. Everything else &mdash; the factions, the Legendary, Project Genesis, the Warden\'s Curse, five hundred years of history bearing down on a single point &mdash; that comes after.</p>'+
  '<p class="s-p">First: are you worth it?</p>'+
  '<div class="s-ornament">&#10022; &middot; &middot; &middot; &#10022;</div>',

// ── ENGINE ──
var curBook = 1;

// Shelf spine colours
var spineClasses = ['sb1','sb2','sb3','sb4','sb5'];
var displayBgClasses = {
  bk1:'background:linear-gradient(145deg,#1a0f02,#3a2008,#1a0f02)',
  bk2:'background:linear-gradient(145deg,#200202,#3a0808,#160202)',
  bk3:'background:linear-gradient(145deg,#011a16,#023028,#011008)',
  bk4:'background:linear-gradient(145deg,#0c0418,#1c0830,#080210)',
  bk5:'background:linear-gradient(145deg,#030610,#08101e,#020408)'
};

// Build tabs
var tabNames = ['I \u2014 The Age Before','II \u2014 The Fracture','III \u2014 The Fragments','IV \u2014 The Factions','V \u2014 The Hunter'];
var tabsEl = document.getElementById('tabs');
tabNames.forEach(function(n, i) {
  var t = document.createElement('div');
  t.className = 'tab' + (i===0?' active':'');
  t.innerHTML = 'Book ' + n;
  t.dataset.book = i+1;
  t.addEventListener('click', function(){ loadBook(i+1); });
  tabsEl.appendChild(t);
});

// Build shelf books (spine view)
var shelfBoard = document.getElementById('shelfBoard');
var bracketL = shelfBoard.querySelector('.shelf-bracket.left');
var bracketR = shelfBoard.querySelector('.shelf-bracket.right');

BOOK_COVERS.forEach(function(c, i) {
  var book = document.createElement('div');
  book.className = 'shelf-book ' + spineClasses[i] + (i===0?' active':'');
  book.dataset.book = i+1;
  var span = document.createElement('span');
  span.textContent = c.spine;
  book.appendChild(span);
  book.addEventListener('click', function(){ loadBook(i+1); });
  // Insert before right bracket
  shelfBoard.insertBefore(book, bracketR);
});

function loadBook(num) {
  curBook = num;
  var c = BOOK_COVERS[num-1];

  // Update shelf active state
  document.querySelectorAll('.shelf-book').forEach(function(b){
    b.classList.toggle('active', parseInt(b.dataset.book)===num);
  });

  // Update display table book cover
  var dbEl = document.getElementById('displayBook');
  dbEl.style.cssText = displayBgClasses[c.bk] + ';width:160px;height:215px;position:relative;border-radius:1px 3px 3px 1px;box-shadow:-4px 4px 16px rgba(0,0,0,.8),4px 2px 10px rgba(0,0,0,.5),inset -3px 0 8px rgba(0,0,0,.4);transform:perspective(400px) rotateY(-4deg) rotateX(2deg);transition:transform .4s ease,box-shadow .4s ease;overflow:hidden;cursor:default;';

  document.getElementById('dbEye').textContent = 'The BIT Codex \u00b7 Vol. ' + c.vol;
  document.getElementById('dbTitle').className = 'db-title ' + c.grad;
  document.getElementById('dbTitle').innerHTML = c.title;
  document.getElementById('dbQuote').innerHTML = c.quote;
  document.getElementById('dbRoman').textContent = c.roman;
  document.getElementById('displayTitle').innerHTML = c.label;

  // Update tabs
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', parseInt(t.dataset.book)===num);
  });

  // Inject scroll content + scroll to top
  document.getElementById('scrollContent').innerHTML = BOOKS[num];
  document.getElementById('scrollInner').scrollTop = 0;

  // Animate shelf book pull-out + display book entrance
  var activeBook = document.querySelector('.shelf-book.active');
  if (activeBook) {
    activeBook.style.transition = 'transform .1s ease-in';
    activeBook.style.transform = 'translateY(-14px) scaleX(1.1)';
    setTimeout(function(){
      activeBook.style.transition = 'transform .3s cubic-bezier(.25,.8,.25,1)';
      activeBook.style.transform = '';
    }, 120);
  }

  // Display book entrance animation
  var db = document.getElementById('displayBook');
  db.style.opacity = '0';
  db.style.transform = 'perspective(400px) rotateY(-15deg) rotateX(4deg) scale(.92)';
  setTimeout(function(){
    db.style.transition = 'opacity .35s ease, transform .35s cubic-bezier(.25,.8,.25,1)';
    db.style.opacity = '1';
    db.style.transform = 'perspective(400px) rotateY(-4deg) rotateX(2deg)';
    setTimeout(function(){ db.style.transition = ''; }, 400);
  }, 60);
}

// Hover on display book
document.getElementById('displayBook').addEventListener('mouseenter', function(){
  this.style.transform = 'perspective(400px) rotateY(-2deg) rotateX(1deg) scale(1.04)';
});
document.getElementById('displayBook').addEventListener('mouseleave', function(){
  this.style.transform = 'perspective(400px) rotateY(-4deg) rotateX(2deg)';
});

// Init
loadBook(1);

// ── AMBIENT PARTICLES ──
(function spawnParticles() {
  const colors = [
    'rgba(200,160,60,',
    'rgba(255,200,80,',
    'rgba(160,100,20,',
    'rgba(255,220,100,',
  ];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'bg-particle';
    const size   = 1 + Math.random() * 3;
    const left   = 5 + Math.random() * 90;
    const dur    = 12 + Math.random() * 20;
    const delay  = Math.random() * 18;
    const color  = colors[Math.floor(Math.random() * colors.length)];
    const op     = (0.3 + Math.random() * 0.5).toFixed(2);
    p.style.cssText = `
      width:${size}px;height:${size}px;
      left:${left}%;bottom:-10px;
      background:${color}${op});
      box-shadow:0 0 ${size*3}px ${color}0.4);
      animation-duration:${dur}s;
      animation-delay:-${delay}s;
    `;
    document.body.appendChild(p);
  }
})();

    // Run navbar init functions after injection
    if (typeof window.attachLogoutHandler === 'function') window.attachLogoutHandler();
    if (typeof window.loadProfileName      === 'function') window.loadProfileName();
    if (typeof window.updateWPCBalance     === 'function') window.updateWPCBalance();
  });

// ── MODE BUTTONS ──
var app = document.getElementById('app');
var readBtn   = document.getElementById('readModeBtn');
var focusBtn  = document.getElementById('focusModeBtn');
var exitHint  = document.getElementById('exitHint');

readBtn.addEventListener('click', function() {
  var isOn = app.classList.toggle('read-mode');
  app.classList.remove('present-mode');
  readBtn.style.color  = isOn ? 'var(--gold-light)' : '';
  readBtn.style.borderColor = isOn ? 'var(--gold)' : '';
  focusBtn.style.color = '';
  focusBtn.style.borderColor = '';
});

focusBtn.addEventListener('click', function() {
  var isOn = app.classList.toggle('present-mode');
  app.classList.remove('read-mode');
  focusBtn.style.color = isOn ? 'var(--gold-light)' : '';
  focusBtn.style.borderColor = isOn ? 'var(--gold)' : '';
  readBtn.style.color  = '';
  readBtn.style.borderColor = '';
});

// ESC to exit any mode
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    app.classList.remove('read-mode','present-mode');
    readBtn.style.color  = '';
    readBtn.style.borderColor = '';
    focusBtn.style.color = '';
    focusBtn.style.borderColor = '';
  }
});

// Click exit hint to exit
exitHint.addEventListener('click', function() {
  app.classList.remove('read-mode','present-mode');
  readBtn.style.color  = '';
  readBtn.style.borderColor = '';
  focusBtn.style.color = '';
  focusBtn.style.borderColor = '';
});
</script>
</body>
</html>
