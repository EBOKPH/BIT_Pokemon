<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verification Failed - Bit-Pokemon</title>
    <link
      id="pagestyle"
      href="../assets/css/soft-ui-dashboard.css?v=1.1.0"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0b0e14;
        color: #fff;
        font-family: "Inter", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #1a1f2e;
        border-radius: 16px;
        box-shadow: 0 8px 32px #0008;
        padding: 40px 32px;
        max-width: 400px;
        width: 90vw;
        text-align: center;
      }
      .card h2 {
        color: #e53935;
        margin-bottom: 18px;
        font-weight: 700;
      }
      .card p {
        color: #fff;
        font-size: 1.1rem;
        margin-bottom: 24px;
      }
      .btn {
        background: #4caf50;
        color: #000;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        padding: 10px 32px;
        cursor: pointer;
        font-size: 1rem;
      }
      .btn:hover {
        background: #43a047;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Verification Failed</h2>
      <p>
        Sorry, your email verification link is invalid or has expired.<br />
        Please try registering again or contact support if you need help.
      </p>
      <a href="#" id="signupLink" class="btn">Go to Sign Up</a>
    </div>
    <script type="module">
      import { getPageLink } from "../api.js";
      document.getElementById("signupLink").onclick = (e) => {
        e.preventDefault();
        window.location.href = getPageLink("pages/sign-up.html");
      };
    </script>
  </body>
</html>
